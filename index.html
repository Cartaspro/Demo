<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMO - Carta Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#E11D48;--bg:#0f0f0f;--card:#1c1c1c;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:120px}
.top{background:#E11D48;color:#fff;text-align:center;padding:10px;font-size:12px;font-weight:800;position:sticky;top:0;z-index:999}
.header{padding:28px 20px;text-align:center}
.logo{width:80px;height:80px;background:var(--primary);border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.badge{background:#f59e0b;color:#000;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:800;margin-top:12px;display:inline-block}
.cats{display:flex;gap:8px;padding:0 16px;overflow-x:auto;margin:16px 0}
.cat{background:#1c1c1c;padding:8px 16px;border-radius:20px;font-size:13px;border:1px solid #2a2a2a;cursor:pointer;white-space:nowrap}
.cat.active{background:#E11D48}
.menu{padding:0 16px;display:grid;gap:14px}
.item{background:#1c1c1c;border-radius:16px;display:flex;overflow:hidden;border:1px solid #262626}
.item img{width:88px;height:88px;object-fit:cover}
.info{flex:1;padding:12px}
.price{color:#E11D48;font-weight:800;margin-top:4px}
.add{margin:12px;background:#E11D48;border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px}
.cart{position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;border-top:1px solid #2a2a2a;padding:12px 16px;display:flex;justify-content:space-between;z-index:100}
.cart button{background:#E11D48;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;display:none;align-items:flex-end}
.modal.active{display:flex}
.box{background:#1c1c1c;width:100%;max-height:88vh;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;margin-top:8px}
.wa{width:100%;background:#25D366;color:#fff;border:none;padding:16px;border-radius:12px;font-weight:800;margin-top:16px}
</style>
</head>
<body>
<div class="top">⚠️ DEMO - Así quedaría la carta de TU local</div>
<script>
const WHATSAPP="5491134890644"; let carrito={}; let catActiva='todos'; let tipo='retiro'; let envio=1500;
const productos=[
{id:1,cat:'hamburguesas',nombre:"Hamburguesa Doble",desc:"Doble carne, doble cheddar, bacon crocante",precio:12500,img:"https://images.unsplash.com/photo-1553979459-d2229ba7433b?q=80&w=600"},
{id:2,cat:'pizzas',nombre:"Pizza Muzzarella",desc:"Mozza, salsa, oregano",precio:13900,img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=600"},
{id:3,cat:'panaderia',nombre:"Docena de Facturas Surtidas",desc:"Medialunas, vigilantes, cañoncitos, pastelitos",precio:8500,img:"https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=600"},
{id:4,cat:'bebidas',nombre:"Coca 1.5L",desc:"Fria",precio:3500,img:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?q=80&w=600"}
];
</script>
<div class="header"><div class="logo">DEMO</div><h1>DEMO - Tu Local</h1><p style="color:#9ca3af;font-size:13px;margin-top:6px">Ejemplo para mostrar a clientes</p><div class="badge">MODO DEMO - PEDIDOS A MI WHATSAPP</div></div>
<div class="cats" id="cats"><div class="cat active" onclick="filtrar('todos',this)">Todos</div><div class="cat" onclick="filtrar('hamburguesas',this)">Hamburguesas</div><div class="cat" onclick="filtrar('pizzas',this)">Pizzas</div><div class="cat" onclick="filtrar('panaderia',this)">Panaderia</div></div>
<div class="menu" id="menu"></div>
<div style="margin:24px 16px 0;background:#111;border:1px dashed #333;border-radius:14px;padding:16px;text-align:center"><h3 style="font-size:14px">¿Te gustó?</h3><p style="font-size:12px;color:#9ca3af;margin-top:6px">La tuya va con tu logo y tu WhatsApp. $65k/mes.</p><a href="https://wa.me/5491134890644?text=Vi%20la%20demo%20quiero%20la%20mia" style="display:inline-block;margin-top:10px;background:#fff;color:#000;padding:10px 16px;border-radius:20px;font-size:12px;font-weight:800;text-decoration:none">Quiero la mia</a></div>
<div class="cart"><div><span id="count">0</span> prod - <b id="total">$0</b></div><button onclick="abrir()">Ver pedido</button></div>
<div class="modal" id="modal" onclick="if(event.target==this) cerrar()"><div class="box"><div style="display:flex;justify-content:space-between"><h3>Pedido DEMO</h3><button onclick="cerrar()" style="background:#262626;border:none;color:#fff;width:30px;height:30px;border-radius:50%">X</button></div><div id="items" style="margin-top:12px"></div><input id="nombre" class="input" placeholder="Tu nombre"><div style="margin-top:12px;display:flex;gap:8px"><button id="b1" onclick="setTipo('retiro')" style="flex:1;padding:10px;border-radius:10px;background:#E11D48;border:1px solid #333;color:#fff">Retiro</button><button id="b2" onclick="setTipo('envio')" style="flex:1;padding:10px;border-radius:10px;background:#262626;border:1px solid #333;color:#fff">Envio</button></div><div id="dirBox" style="display:none"><input id="dir" class="input" placeholder="Dirección"></div><div style="margin-top:12px;display:flex;justify-content:space-between;font-weight:800"><span>Total:</span><span id="mtotal">$0</span></div><button class="wa" onclick="enviar()" style="display:flex;align-items:center;justify-content:center;gap:8px"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.46 2 2 6.46 2 12.04c0 1.77.46 3.45 1.32 4.95L2 22l5.25-1.38A9.9 9.9 0 0 0 12.04 22c5.58 0 10.04-4.46 10.04-10.04C22.08 6.46 17.62 2 12.04 2zm0 18.04a8.08 8.08 0 0 1-4.1-1.12l-.29-.17-3.12.82.83-3.04-.19-.31A8.07 8.07 0 0 1 4 12.04C4 7.56 7.56 4 12.04 4 16.52 4 20.08 7.56 20.08 12.04c0 4.48-3.56 8.04-8.04 8.04zm4.5-6.04c-.25-.12-1.47-.72-1.7-.8-.23-.08-.39-.12-.56.12-.17.25-.64.8-.79.96-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.1-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.35-.77-1.85-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.87.85-.87 2.07s.89 2.4 1.01 2.57c.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.55.1.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.23-.17-.48-.29z"/></svg> Pedí por WhatsApp</button></div></div>
<script>
function filtrar(c,e){catActiva=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));e.classList.add('active');render()}
function render(){let l=catActiva=='todos'?productos:productos.filter(p=>p.cat==catActiva);document.getElementById('menu').innerHTML=l.map(p=>`<div class="item"><img src="${p.img}"><div class="info"><h3>${p.nombre}</h3><p style="font-size:11px;color:#9ca3af">${p.desc}</p><div class="price">$${p.precio}</div></div><button class="add" onclick="add(${p.id})">+</button></div>`).join('')}
function add(id){carrito[id]=(carrito[id]||0)+1;upd()}
function upd(){let t=0,n=0;for(let id in carrito){let p=productos.find(x=>x.id==id);t+=p.precio*carrito[id];n+=carrito[id]}let f=tipo=='envio'?t+envio:t;document.getElementById('total').innerText='$'+f;document.getElementById('mtotal').innerText='$'+f;document.getElementById('count').innerText=n;let h='';for(let id in carrito){let p=productos.find(x=>x.id==id);h+=`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #262626"><span>${p.nombre} x${carrito[id]}</span><span><button onclick="chg(${id},-1)" style="width:24px;height:24px;border-radius:50%">-</button> ${carrito[id]} <button onclick="chg(${id},1)" style="width:24px;height:24px;border-radius:50%">+</button></span></div>`}document.getElementById('items').innerHTML=h||'<p style="color:#666;text-align:center">Vacío</p>'}
function chg(id,d){carrito[id]+=d;if(carrito[id]<=0) delete carrito[id];upd()}
function abrir(){document.getElementById('modal').classList.add('active')} function cerrar(){document.getElementById('modal').classList.remove('active')}
function setTipo(tt){tipo=tt;document.getElementById('b1').style.background=tt=='retiro'?'#E11D48':'#262626';document.getElementById('b2').style.background=tt=='envio'?'#E11D48':'#262626';document.getElementById('dirBox').style.display=tt=='envio'?'block':'none'}
function enviar(){if(Object.keys(carrito).length==0){alert('Agrega algo');return}let nom=document.getElementById('nombre').value.trim();if(!nom){alert('Nombre');return}let msg=`Hola! Vi la DEMO - Pedido prueba de *${nom}*:%0A`;let tot=0;for(let id in carrito){let p=productos.find(x=>x.id==id);msg+=`• ${p.nombre} x${carrito[id]} - $${p.precio*carrito[id]}%0A`;tot+=p.precio*carrito[id]}msg+=`%0ATotal $${tot}%0A%0A_Es prueba de demo_`;window.open(`https://wa.me/${WHATSAPP}?text=${msg}`,'_blank')}
render()
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
