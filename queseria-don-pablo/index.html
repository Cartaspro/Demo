<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quesería Don Pablo 🧀 - Carta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#080808;color:#fff;overflow-x:hidden}
.hero{position:relative;height:36vh;min-height:280px;overflow:hidden} .hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)} .hero-overlay{position:absolute;inset:0;background:linear-gradient(0deg,#080808 0%,transparent 70%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:20px;max-width:1200px;margin:0 auto} .hero h1{font-family:'Bebas Neue',sans-serif;font-size:54px;line-height:.9} .hero h1 span{color:#FFD60A} .hero p{font-size:13px;color:#ddd;margin-top:6px}
.topinfo{max-width:1200px;margin:-18px auto 0;padding:0 16px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;position:relative;z-index:5} @media(max-width:860px){.topinfo{grid-template-columns:1fr}}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:22px;padding:18px} .card b{font-size:13px;color:#FFD60A;display:block;margin-bottom:8px} .small{font-size:12px;color:#aaa;line-height:1.6}
.mapwrap{border-radius:14px;overflow:hidden;margin-top:12px;border:1px solid #333} .mapwrap iframe{width:100%;height:200px;border:0}
.tabs{display:flex;gap:8px;margin-top:12px} .tab{flex:1;padding:12px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#777;font-size:13px;font-weight:800;cursor:pointer;text-align:center} .tab.on{background:#FFD60A;color:#000;border-color:#FFD60A}
.cats{max-width:1200px;margin:16px auto 0;padding:0 16px;display:flex;gap:8px;overflow:auto} .cat{white-space:nowrap;padding:10px 18px;border-radius:100px;border:1px solid #2a2a2a;background:#141414;color:#888;font-size:12px;font-weight:800;cursor:pointer} .cat.on{background:#fff;color:#000}
.grid{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{background:#1e1e1e;border:1px solid #262626;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;position:relative} .item.destacado::before{content:'⭐ DESTACADO';position:absolute;top:12px;left:12px;background:#FFD60A;color:#000;padding:5px 10px;border-radius:100px;font-size:10px;font-weight:900;z-index:2}
.item img{width:100%;height:190px;object-fit:cover} .info{padding:16px;flex:1;display:flex;flex-direction:column} .name{font-weight:900;font-size:16px} .desc{font-size:12px;color:#888;margin-top:6px;flex:1} .priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:12px} .price{font-weight:900;font-size:20px} .price span{color:#FFD60A} .add{background:#fff;color:#000;border:0;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}
.cart{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(20,20,20,.97);border:1px solid #2a2a2a;border-radius:22px;padding:14px;z-index:50} .cart-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:flex-start} .cart-list{flex:1;font-size:12px;color:#aaa;max-height:110px;overflow:auto} .cart-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #222} .cart-actions button{background:#262626;color:#fff;border:0;width:26px;height:26px;border-radius:6px;cursor:pointer;margin-left:4px} .cart-actions button.del{background:#ff0033} .cart-total{font-weight:900;font-size:18px;text-align:right} .send{background:#FFD60A;color:#000;border:0;padding:14px 22px;border-radius:100px;font-weight:900;cursor:pointer;width:100%;margin-top:8px}
.form{max-width:1200px;margin:0 auto;padding:0 16px 20px} .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:700px){.formGrid{grid-template-columns:1fr}} .input{background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;width:100%} .input.err{border-color:#ff0033} .label{font-size:11px;color:#FFD60A;font-weight:800;margin-bottom:6px;display:block;text-transform:uppercase}
.inactiveWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#080808;padding:20px} .inactiveBox{max-width:560px;width:100%;background:#1c1c1c;border:2px solid #ff0033;border-radius:32px;padding:48px 32px;text-align:center} .inactiveBox .icon{width:90px;height:90px;background:#ff0033;border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:44px}
</style>
</head><body>
<div id="app"></div>
<script>
const CONFIG_DEFAULT = {"nombre": "Quesería Don Pablo 🧀", "subtitulo": "Quesos artesanales & Picadas Premium", "direccion": "Av. Meeks 1200, Lomas de Zamora", "telefono": "11 4292-8800", "whatsapp": "5491134890644", "horarios": "Lun a Sáb 9 a 20hs | Dom 9 a 13hs", "googleMaps": {"embed": "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.2!2d-58.401!3d-34.762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sAv.+Meeks+1200,+Lomas+de+Zamora!5e0!3m2!1ses!2sar!4v1", "link": "https://maps.google.com/?q=Av.+Meeks+1200,+Lomas+de+Zamora"}, "envio": {"tipo": "fijo", "costoFijo": 1500, "mensaje": "Envío $1500 - si es 0 dice envío gratis", "retiro": "Retiro gratis en local"}, "activo": true, "estado": "activo"};
const DATA_DEFAULT = [{"id": 1, "categoria": "Quesos Duros", "nombre": "Sardo 12 meses 1kg", "descripcion": "Intenso, ideal para rallar", "precio": 14500, "img": "https://images.unsplash.com/photo-1552767059-ce182ead6c1b?w=600", "destacado": true}, {"id": 2, "categoria": "Quesos Blandos", "nombre": "Muzzarella Premium 1kg", "descripcion": "Hilada a mano", "precio": 8900, "img": "https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=600"}, {"id": 3, "categoria": "Picadas", "nombre": "Picada p/2", "descripcion": "Sardo, Fontina, Salame, Olivas", "precio": 18900, "img": "https://images.unsplash.com/photo-1544148103-077ea10c9e28?w=600", "destacado": true}, {"id": 4, "categoria": "Fiambres", "nombre": "Jamón Crudo 500g", "descripcion": "12 meses", "precio": 19500, "img": "https://images.unsplash.com/photo-1548943487-a2e4e43b4853?w=600"}];

(async function(){
  let CONFIG=CONFIG_DEFAULT, DATA=DATA_DEFAULT;
  try{
    const slug=location.pathname.split('/').filter(Boolean).pop() || 'queseria-don-pablo';
    const base='https://raw.githubusercontent.com/Cartaspro/cartas/main/';
    const [c,d]=await Promise.all([
      fetch(base+`config/${slug}.json?v=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(base+`data/${slug}.json?v=${Date.now()}`).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    if(c) CONFIG=c; if(d) DATA=d;
  }catch(e){}

  const app=document.getElementById('app');
  // CHEQUEO BAJA - por si queda cache viejo
  if(CONFIG.activo===false || CONFIG.estado==='baja'){
    app.innerHTML=`<div class="inactiveWrap"><div class="inactiveBox"><div class="icon">⛔</div><h1 style="font-family:'Bebas Neue';font-size:44px"><span style="color:#ff0033">PÁGINA</span> INACTIVA</h1><p style="color:#fff;font-weight:800;font-size:20px;margin-top:12px">Pagina inactiva, si sos el dueño del local contacta con soporte</p></div></div>`;
    return;
  }

  let modo='retiro';
  let catActiva='Todos';
  let CARRITO=[];
  window.clientData={nombre:'', telefono:'', direccion:'', notas:''};

  function getEnvioTexto(){
    const costo=Number(CONFIG.envio?.costoFijo||0);
    if(costo===0) return '🎉 Envío gratis';
    return `🛵 Envío $${costo.toLocaleString('es-AR')}`;
  }
  function getEnvioCosto(){
    const costo=Number(CONFIG.envio?.costoFijo||0);
    if(modo==='retiro') return 0;
    return costo;
  }

  function getCats(){ return ['Todos', ...new Set(DATA.map(d=>d.categoria))]; }

  function render(){
    const cats=getCats();
    app.innerHTML=`
      <div class="hero"><img src="https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=1200"><div class="hero-overlay"></div><div class="hero-content"><h1>Quesería <span>Don Pablo 🧀</span></h1><p>Quesos artesanales & Picadas Premium • Lun a Sáb 9 a 20hs | Dom 9 a 13hs</p></div></div>
      <div style="max-width:1200px;margin:-18px auto 0;padding:0 16px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;position:relative;z-index:5">
        <div class="card"><b>📍 Nuestro local - Pin</b><div class="small">${CONFIG.direccion}<br>${CONFIG.horarios}</div><div class="mapwrap"><iframe src="${CONFIG.googleMaps?.embed||''}" loading="lazy"></iframe></div><a href="${CONFIG.googleMaps?.link||''}" target="_blank" style="display:inline-block;background:#FFD60A;color:#000;padding:7px 14px;border-radius:100px;font-size:11px;font-weight:900;margin-top:10px;text-decoration:none">📍 Ver pin del local en Google Maps</a></div>
        <div class="card"><b>🛵 Retiro / Envío - Fijo editable</b><div class="tabs"><div class="tab ${modo==='retiro'?'on':''}" onclick="setModo('retiro')">🏪 Retiro gratis</div><div class="tab ${modo==='envio'?'on':''}" onclick="setModo('envio')">🛵 Envío</div></div><div id="envioBox" style="margin-top:14px"></div></div>
      </div>
      <div class="cats">${cats.map(c=>`<div class="cat ${catActiva===c?'on':''}" onclick="catActiva='${c}';render()">${c}</div>`).join('')}</div>
      <div class="grid" id="grid"></div>
      <div class="form">
        <div class="card" style="background:#111"><b>📝 Tus datos - Obligatorio</b><div class="formGrid"><div><span class="label">Nombre *</span><input id="f_nombre" class="input" placeholder="Tu nombre" value="${window.clientData.nombre}" oninput="window.clientData.nombre=this.value"></div><div><span class="label">Tel *</span><input id="f_tel" class="input" placeholder="11..." value="${window.clientData.telefono}" oninput="window.clientData.telefono=this.value"></div><div style="grid-column:1/-1"><span class="label">Dirección cliente - pin 📍 *</span><input id="f_dir" class="input" placeholder="Av. Alsina 1234, Banfield" value="${window.clientData.direccion}" oninput="window.clientData.direccion=this.value"></div><div style="grid-column:1/-1"><span class="label">Notas</span><input id="f_notas" class="input" placeholder="Piso, timbre" value="${window.clientData.notas}" oninput="window.clientData.notas=this.value"></div></div></div>
      </div>
      <div style="height:160px"></div>
      <div class="cart"><div class="cart-inner"><div class="cart-list" id="cartList"></div><div style="min-width:160px"><div class="cart-total" id="total"></div><button class="send" onclick="pedir()">Pedir por WhatsApp 🧀</button></div></div></div>
    `;
    const filtrados = catActiva==='Todos'?DATA:DATA.filter(d=>d.categoria===catActiva);
    document.getElementById('grid').innerHTML=filtrados.map(p=>`<div class="item ${p.destacado?'destacado':''}"><img src="${p.img}"><div class="info"><div class="name">${p.nombre}</div><div class="desc">${p.descripcion}</div><div class="priceRow"><div class="price">$<span>${Number(p.precio).toLocaleString('es-AR')}</span></div><button class="add" onclick="add(${p.id})">+ Agregar</button></div></div></div>`).join('');
    const eb=document.getElementById('envioBox');
    if(eb){
      const costo=Number(CONFIG.envio?.costoFijo||0);
      if(modo==='retiro') eb.innerHTML=`<div style="background:#0f0f0f;border:1px solid #1f3d1f;border-radius:12px;padding:12px"><b style="color:#00ff88">✅ Retiro gratis en local</b><div class="small">Retirá en ${CONFIG.direccion}</div></div>`;
      else eb.innerHTML=`<div class="small">Desde <b style="color:#fff">${CONFIG.direccion}</b> hasta tu dirección.<br><b style="color:#FFD60A;font-size:14px">${costo===0?'🎉 Envío gratis':`🛵 Envío $${costo}`}</b><br>Editable en admin: envio.costoFijo (si es 0 = gratis)</div>`;
    }
    upd();
  }

  window.setModo=function(m){ modo=m; render(); }
  window.add=function(id){ const pr=DATA.find(x=>x.id===id); const ex=CARRITO.find(x=>x.id===id); if(ex) ex.cant++; else CARRITO.push({...pr,cant:1}); upd(); }
  window.remove=function(id){ const ex=CARRITO.find(x=>x.id===id); if(!ex) return; ex.cant--; if(ex.cant<=0) CARRITO=CARRITO.filter(x=>x.id!==id); upd(); }
  window.del=function(id){ CARRITO=CARRITO.filter(x=>x.id!==id); upd(); }
  window.upd=function(){
    const list=document.getElementById('cartList'); const tot=document.getElementById('total'); if(!list) return;
    if(!CARRITO.length){ list.innerHTML='<span style="color:#555">Carrito vacío</span>'; if(tot) tot.innerHTML=''; return; }
    let t=0, ht=''; CARRITO.forEach(c=>{ t+=c.precio*c.cant; ht+=`<div class="cart-item"><div><b>${c.cant}x ${c.nombre}</b></div><div class="cart-actions"><button onclick="remove(${c.id})">-</button><button onclick="add(${c.id})">+</button><button class="del" onclick="del(${c.id})">×</button></div></div>`; });
    list.innerHTML=ht;
    const env=getEnvioCosto();
    const total=t+env;
    if(tot) tot.innerHTML=`Sub $${t.toLocaleString('es-AR')}<br>${modo==='retiro'?'Retiro gratis':env===0?'Envío gratis':`Envío $${env}`}<br><b>$${total.toLocaleString('es-AR')}</b>`;
  }

  window.pedir=function(){
    const nombre=document.getElementById('f_nombre')?.value.trim();
    const tel=document.getElementById('f_tel')?.value.trim();
    const dir=document.getElementById('f_dir')?.value.trim();
    let faltan=[];
    if(!nombre) faltan.push('Nombre');
    if(!tel) faltan.push('Teléfono');
    if(modo==='envio' && !dir) faltan.push('Dirección con pin (para envío)');
    if(!CARRITO.length) faltan.push('Productos');
    if(faltan.length){ alert('⚠️ Faltan:\n• '+faltan.join('\n• ')); return; }
    let texto = `🧀 *Pedido - ${CONFIG.nombre}* 🧀\n\n`;
    texto+=`👤 *Cliente:* ${nombre}\n📞 *Tel:* ${tel}\n`;
    if(dir) texto+=`📍 *Dirección cliente (pin):* ${dir}\n`;
    if(window.clientData.notas) texto+=`📝 *Notas:* ${window.clientData.notas}\n`;
    texto+=`\n🛒 *Pedido:*\n`;
    CARRITO.forEach(c=>{ texto+=`• ${c.cant}x ${c.nombre} - $${c.precio*c.cant}\n`; });
    texto+=`\n📦 *Modo:* ${modo==='retiro'?'🏪 Retiro gratis en local':'🛵 Envío a domicilio'}\n`;
    const env=getEnvioCosto();
    texto+=`${env===0 ? '🎉 *Envío gratis*' : `💰 *Envío:* $${env}`}\n`;
    texto+=`🗺️ *Ruta:* https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(CONFIG.direccion)}&destination=${encodeURIComponent(dir||'')} \n\n`;
    texto+=`💳 *TOTAL: $${(CARRITO.reduce((s,c)=>s+c.precio*c.cant,0)+env).toLocaleString('es-AR')}*\n\n✅ Gracias!`;
    const url=`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`;
    window.open(url,'_blank');
  }

  render();
})();
</script>
</body></html>
