<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quesería Don Pablo 🧀 - Carta Llamativa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#080808;color:#fff;overflow-x:hidden}
.hero{position:relative;height:42vh;min-height:340px;overflow:hidden;background:#111}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.6) saturate(1.2)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(0deg,#080808 0%,rgba(8,8,8,.2) 60%,rgba(8,8,8,.6) 100%)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:26px 20px;max-width:1200px;margin:0 auto}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:62px;line-height:.9;color:#fff} .hero h1 span{color:#FFD60A}
.hero p{color:#fff;font-size:14px;margin-top:8px;opacity:.85} .hero-badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hbadge{background:rgba(255,214,10,.15);border:1px solid #FFD60A;color:#FFD60A;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:800}
.topinfo{max-width:1200px;margin:-24px auto 0;padding:0 16px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;position:relative;z-index:5}
@media(max-width:860px){.topinfo{grid-template-columns:1fr} .hero h1{font-size:44px}}
.card{background:rgba(28,28,28,.92);border:1px solid #2a2a2a;border-radius:22px;padding:18px;backdrop-filter:blur(16px)}
.card b{font-size:13px;display:block;margin-bottom:8px;color:#FFD60A} .small{font-size:12px;color:#aaa;line-height:1.6}
.badge{display:inline-block;background:#FFD60A;color:#000;padding:7px 14px;border-radius:100px;font-size:11px;font-weight:900;margin-top:10px;text-decoration:none}
.mapwrap{border-radius:14px;overflow:hidden;margin-top:12px;border:1px solid #333} .mapwrap iframe{width:100%;height:200px;border:0}
.tabs{display:flex;gap:8px;margin-top:12px} .tab{padding:10px 16px;border-radius:100px;border:1px solid #333;background:#0f0f0f;color:#777;font-size:12px;cursor:pointer;font-weight:800} .tab.on{background:#FFD60A;color:#000;border-color:#FFD60A}
.cats{max-width:1200px;margin:18px auto 0;padding:0 16px;display:flex;gap:8px;overflow:auto} .cat{white-space:nowrap;padding:10px 18px;border-radius:100px;border:1px solid #2a2a2a;background:#141414;color:#888;font-size:12px;font-weight:800;cursor:pointer} .cat.on{background:#fff;color:#000;border-color:#fff}
.grid{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.item{background:linear-gradient(180deg,#1e1e1e 0%,#161616 100%);border:1px solid #262626;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:.3s;position:relative}
.item:hover{transform:translateY(-4px);border-color:#FFD60A} .item.destacado::before{content:'⭐ DESTACADO';position:absolute;top:12px;left:12px;background:#FFD60A;color:#000;font-size:9px;font-weight:900;padding:5px 10px;border-radius:100px;z-index:2}
.item img{width:100%;height:200px;object-fit:cover;background:#111} .info{padding:16px;flex:1;display:flex;flex-direction:column}
.name{font-weight:900;font-size:16px} .desc{font-size:12px;color:#888;margin-top:6px;flex:1} .priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:12px} .price{font-weight:900;font-size:20px} .price span{color:#FFD60A}
.add{background:#fff;color:#000;border:0;padding:12px 18px;border-radius:12px;font-weight:900;cursor:pointer}
.cart{position:fixed;left:16px;right:16px;bottom:16px;background:rgba(20,20,20,.92);border:1px solid #2a2a2a;border-radius:22px;padding:14px 16px;z-index:50;backdrop-filter:blur(20px)}
.cart-inner{max-width:1200px;margin:0 auto;display:flex;gap:12px;align-items:center} .cart-list{flex:1;font-size:12px;color:#aaa;max-height:70px;overflow:auto} .cart-total{font-weight:900;font-size:18px} .send{background:#FFD60A;color:#000;border:0;padding:14px 22px;border-radius:100px;font-weight:900;cursor:pointer}
/* INACTIVA SIN TU NUMERO - LLAMATIVA PERO PRIVADA */
.inactiveWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#3a0a0a 0%,#080808 70%);padding:20px}
.inactiveBox{max-width:560px;width:100%;background:#1c1c1c;border:2px solid #ff0033;border-radius:32px;padding:48px 32px;text-align:center;box-shadow:0 0 100px rgba(255,0,51,.25)}
.inactiveBox .icon{width:90px;height:90px;background:#ff0033;border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:44px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.inactiveBox h1{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:.9} .inactiveBox h1 span{color:#ff0033}
</style>
</head><body>
<div id="app"></div>
<script>
const CONFIG_DEFAULT = {"nombre": "Quesería Don Pablo 🧀", "subtitulo": "Quesos artesanales & Picadas Premium", "direccion": "Av. Meeks 1200, Lomas de Zamora", "telefono": "11 4292-8800", "whatsapp": "5491134890644", "horarios": "Lun a Sáb 9 a 20hs | Dom 9 a 13hs", "googleMaps": {"embed": "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.2!2d-58.401!3d-34.762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sAv.%20Meeks%201200%2C%20Lomas%20de%20Zamora!5e0!3m2!1ses!2sar!4v1", "link": "https://maps.google.com/?q=Av.+Meeks+1200,+Lomas+de+Zamora"}, "envio": {"tipo": "variable", "costoFijo": 2000, "costoPorKm": 600, "kmGratis": 1, "mensaje": "Envío variable por km - ¡1km gratis!", "retiro": "Retiro gratis en local - 10% OFF"}, "activo": true, "estado": "activo"};
const DATA_DEFAULT = [{"id": 1, "categoria": "Quesos Duros", "nombre": "Sardo Estacionado 12 meses", "descripcion": "Intenso, ideal para rallar. Horma 1kg. Premio nacional 2024", "precio": 14500, "img": "https://images.unsplash.com/photo-1552767059-ce182ead6c1b?w=600", "destacado": true}, {"id": 2, "categoria": "Quesos Blandos", "nombre": "Muzzarella Premium 1kg", "descripcion": "Hilada a mano, derretimiento perfecto. La favorita de pizzerías", "precio": 8900, "img": "https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=600"}, {"id": 3, "categoria": "Quesos Blandos", "nombre": "Cremoso Artesanal 1kg", "descripcion": "El más vendido. Cremoso, suave, 100% leche de campo", "precio": 8200, "img": "https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=600"}, {"id": 4, "categoria": "Picadas", "nombre": "Picada Don Pablo p/2", "descripcion": "Sardo, Fontina, Salame Candelario, Olivas, Nuez + Pan casero", "precio": 18900, "img": "https://images.unsplash.com/photo-1544148103-077ea10c9e28?w=600", "destacado": true}, {"id": 5, "categoria": "Picadas", "nombre": "Picadón XL p/4 personas", "descripcion": "5 quesos, 3 fiambres, aceitunas, berenjenas, pan de campo", "precio": 32500, "img": "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600", "destacado": true}, {"id": 6, "categoria": "Fiambres", "nombre": "Jamón Crudo Bodega 500g", "descripcion": "12 meses de estacionamiento. Cortado fino a cuchillo", "precio": 19500, "img": "https://images.unsplash.com/photo-1548943487-a2e4e43b4853?w=600"}, {"id": 7, "categoria": "Fiambres", "nombre": "Salame Candelario 400g", "descripcion": "Receta de la nona. Picado grueso, sabor intenso", "precio": 8900, "img": "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600"}, {"id": 8, "categoria": "Combos", "nombre": "Combo Asado + Queso", "descripcion": "Provolone + Chimichurri + Morrones. Listo para parrilla", "precio": 11200, "img": "https://images.unsplash.com/photo-1558030006-450066393d65?w=600"}];

(async function(){
  let CONFIG=CONFIG_DEFAULT, DATA=DATA_DEFAULT;
  try{
    const slug=location.pathname.split('/').filter(Boolean).pop();
    const base='https://raw.githubusercontent.com/Cartaspro/cartas/main/';
    if(slug){ const [c,d]=await Promise.all([fetch(base+`config/${slug}.json?v=${Date.now()}`).then(r=>r.json()).catch(()=>null), fetch(base+`data/${slug}.json?v=${Date.now()}`).then(r=>r.json()).catch(()=>null)]); if(c) CONFIG=c; if(d) DATA=d; }
  }catch(e){}

  const app=document.getElementById('app');

  // >>> BLOQUEO SIN MOSTRAR TU NUMERO <<<
  const baja = CONFIG.activo===false || CONFIG.estado==='baja' || CONFIG.estado==='inactivo';
  if(baja){
    app.innerHTML=`
      <div class="inactiveWrap">
        <div class="inactiveBox">
          <div class="icon">⛔</div>
          <h1><span>PÁGINA</span> INACTIVA</h1>
          <p style="color:#fff;font-weight:800;font-size:20px;margin-top:12px;line-height:1.3">Pagina inactiva, si sos el dueño del local contacta con soporte</p>
          <p style="color:#888;font-size:14px;margin-top:14px;line-height:1.6">La carta de <b style="color:#fff">${CONFIG.nombre}</b> está pausada temporalmente.<br>El propietario ya cuenta con el contacto de soporte para reactivar el servicio.</p>
          <div style="margin-top:18px;background:#0f0f0f;border:1px dashed #333;border-radius:14px;padding:14px;font-size:11px;color:#555">Este aviso es visible para el público. No se muestra ningún número de contacto.<br>El dueño del local sabe cómo comunicarse con administración.</div>
        </div>
      </div>`;
    return;
  }

  let modo='envio', catActiva='Todos';
  function getCats(){ return ['Todos', ...new Set(DATA.map(d=>d.categoria))]; }
  function render(){
    const cats=getCats();
    app.innerHTML=`
      <div class="hero"><img src="https://images.unsplash.com/photo-1486297678162-eb2a19b0a32d?w=1200"><div class="hero-overlay"></div><div class="hero-content"><h1>Quesería <span>Don Pablo 🧀</span></h1><p>Quesos artesanales & Picadas Premium</p><div class="hero-badges"><div class="hbadge">📍 Av. Meeks 1200, Lomas de Zamora</div><div class="hbadge">📞 11 4292-8800</div></div></div></div>
      <div class="topinfo"><div class="card"><b>📍 Dónde estamos</b><div class="small">Av. Meeks 1200, Lomas de Zamora<br>Tel: 11 4292-8800</div><div class="mapwrap"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.2!2d-58.401!3d-34.762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sAv.%20Meeks%201200%2C%20Lomas%20de%20Zamora!5e0!3m2!1ses!2sar!4v1" loading="lazy"></iframe></div><a href="https://maps.google.com/?q=Av.+Meeks+1200,+Lomas+de+Zamora" target="_blank" class="badge">Abrir en Google Maps →</a></div><div class="card"><b>🛵 Retiro / Envíos con Google Maps</b><div class="tabs"><div class="tab ${modo==='retiro'?'on':''}" onclick="modo='retiro';render()">Retiro</div><div class="tab ${modo==='envio'?'on':''}" onclick="modo='envio';render()">Envío</div></div><div id="envioBox" style="margin-top:12px"></div><div class="mapwrap"><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3277.2!2d-58.401!3d-34.762!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sAv.%20Meeks%201200%2C%20Lomas%20de%20Zamora!5e0!3m2!1ses!2sar!4v1" loading="lazy"></iframe></div></div></div>
      <div class="cats">${cats.map(c=>`<div class="cat ${catActiva===c?'on':''}" onclick="catActiva='${c}';render()">${c}</div>`).join('')}</div>
      <div class="grid" id="grid"></div><div style="height:140px"></div>
      <div class="cart"><div class="cart-inner"><div class="cart-list" id="cartList">Vacío</div><div style="text-align:right"><div class="cart-total" id="total"></div><button class="send" onclick="pedir()">Pedir por WhatsApp</button></div></div></div>
    `;
    const eb=document.getElementById('envioBox');
    if(modo==='retiro') eb.innerHTML=`<div class="small"><b style="color:#FFD60A">${CONFIG.envio?.retiro}</b><br>Av. Meeks 1200, Lomas de Zamora</div>`;
    else { const e=CONFIG.envio||{}; let txt=e.tipo==='fijo'?`Fijo $${e.costoFijo}`:e.tipo==='variable'?`Variable $${e.costoPorKm}/km`:e.mensaje||''; eb.innerHTML=`<div class="small"><b style="color:#FFD60A">${txt}</b><br>${e.mensaje||''}</div><div style="margin-top:10px"><input id="kmIn" type="number" placeholder="Km" style="background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:12px;color:#fff;width:100%" oninput="calcEnv()"><div id="calcOut" class="small" style="margin-top:6px;color:#FFD60A"></div></div>`; }
    const filtrados = catActiva==='Todos'?DATA:DATA.filter(d=>d.categoria===catActiva);
    document.getElementById('grid').innerHTML=filtrados.map(p=>`<div class="item ${p.destacado?'destacado':''}"><img src="${p.img}"><div class="info"><div class="name">${p.nombre}</div><div class="desc">${p.descripcion}</div><div class="priceRow"><div class="price">$<span>${Number(p.precio).toLocaleString('es-AR')}</span></div><button class="add" onclick="add(${p.id})">+ Agregar</button></div></div></div>`).join('');
  }
  window.render=render;
  window.calcEnv=function(){ const km=Number(document.getElementById('kmIn')?.value||0); const e=CONFIG.envio||{}; if(e.tipo!=='variable') return; const cob=Math.max(0,km-(e.kmGratis||0)); const costo=cob*(e.costoPorKm||0); document.getElementById('calcOut').innerText=cob<=0?`Gratis dentro de ${e.kmGratis}km`:`${km}km = $${costo}`; window.costoEnvioCalc=costo; window.upd(); }
  let CARRITO=[]; window.add=function(id){ const pr=DATA.find(x=>x.id===id); const ex=CARRITO.find(x=>x.id===id); if(ex) ex.cant++; else CARRITO.push({...pr,cant:1}); upd(); }
  window.upd=function(){ if(!CARRITO.length){document.getElementById('cartList').innerHTML='Vacío';document.getElementById('total').innerText='';return;} let t=0,ht=''; CARRITO.forEach(c=>{t+=c.precio*c.cant;ht+=c.cant+'x '+c.nombre+'<br>';}); document.getElementById('cartList').innerHTML=ht; let env=0; if(modo==='envio'){ if(CONFIG.envio?.tipo==='fijo') env=CONFIG.envio.costoFijo||0; if(CONFIG.envio?.tipo==='variable') env=window.costoEnvioCalc||0; } document.getElementById('total').innerText='$'+(t+env).toLocaleString('es-AR'); }
  window.pedir=function(){ if(!CARRITO.length) return alert('Vacío'); let m=`Hola ${CONFIG.nombre}!%0A`; CARRITO.forEach(c=>{m+=`${c.cant}x ${c.nombre}%0A`;}); window.open(`https://wa.me/${CONFIG.whatsapp}?text=${m}`,'_blank'); }
  render();
})();
</script>
</body></html>
