<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Página inactiva</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800;900&family=Bebas+Neue&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:#080808;color:#fff}.inactiveWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0%,#3a0a0a 0%,#080808 70%);padding:20px}.inactiveBox{max-width:560px;width:100%;background:#1c1c1c;border:2px solid #ff0033;border-radius:32px;padding:48px 32px;text-align:center;box-shadow:0 0 100px rgba(255,0,51,.25)}.icon{width:90px;height:90px;background:#ff0033;border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:44px;animation:pulse 1.2s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}h1{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:.9}h1 span{color:#ff0033}</style></head><body><div class="inactiveWrap"><div class="inactiveBox"><div class="icon">⛔</div><h1><span>PÁGINA</span> INACTIVA</h1><p style="color:#fff;font-weight:800;font-size:22px;margin-top:14px;line-height:1.2">Pagina inactiva, si sos el dueño del local contacta con soporte</p><p style="color:#888;font-size:14px;margin-top:12px">Esta carta fue pausada temporalmente. Sin números expuestos al público.</p></div></div></body></html>
