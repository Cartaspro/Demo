<!DOCTYPE html>
<html lang="es"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Editar Menú Directo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f0f0f;color:#fff}
.top{padding:16px 20px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f0f0f;z-index:10}
.logo{font-weight:900;display:flex;gap:8px;align-items:center}
.dot{width:28px;height:28px;background:#E11D48;border-radius:8px;display:flex;align-items:center;justify-content:center}
.main{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;min-height:100vh}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.left{border-right:1px solid #1c1c1c;padding:16px}
.right{padding:16px}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:16px;padding:14px;margin-bottom:12px}
input{background:#0f0f0f;border:1px solid #262626;border-radius:10px;padding:10px;color:#fff;width:100%;font-size:13px}
.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer;font-size:13px}
.btn-w{background:#fff;color:#000}
.btn-r{background:#E11D48;color:#fff}
.btn-g{background:#262626;color:#fff}
.client{padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;justify-content:space-between;margin-bottom:6px;background:#0f0f0f;border:1px solid #1c1c1c}
.client.active{background:#fff;color:#000;border-color:#fff}
.preview{width:100%;height:520px;border-radius:16px;border:1px solid #262626;background:#000}
.prod{display:flex;gap:10px;align-items:center;background:#0f0f0f;border:1px solid #1c1c1c;border-radius:14px;padding:10px;margin-bottom:8px}
.prod img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#1c1c1c}
.small{font-size:11px;color:#666;margin-top:4px}
</style>
</head><body>
<div class="top">
<div class="logo"><div class="dot">C</div> Admin - Editar menú directo</div>
<div style="display:flex;gap:8px"><input id="token" type="password" placeholder="Token ghp_..." style="width:200px"><button class="btn btn-w" onclick="saveTok()">Guardar</button><button class="btn btn-g" onclick="listar()">↻</button></div>
</div>

<div class="main">
<div class="left">
<div class="card">
<b style="font-size:13px">Clientes</b>
<div id="list" style="margin-top:10px">Cargando...</div>
</div>
<div class="card">
<b style="font-size:13px">+ Subir 3 archivos que te paso</b>
<div class="small">Slug + arrastrá data.json, config.json, index.html</div>
<input id="slugNew" placeholder="Slug: el-fuego" style="margin-top:8px">
<div id="drop" style="margin-top:8px;border:1px dashed #333;border-radius:12px;padding:16px;text-align:center;font-size:12px;color:#888;cursor:pointer">Arrastrá acá los 3 archivos<br><span class="small">click para seleccionar</span><input id="fileIn" type="file" multiple hidden></div>
<button class="btn btn-w" style="width:100%;margin-top:8px" onclick="subir()">Subir a GitHub</button>
<div id="upOut" class="small"></div>
</div>
</div>

<div class="right">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="title">Seleccioná un cliente</b><div><button class="btn btn-g" onclick="reload()">Recargar vista</button> <button class="btn btn-g" onclick="openReal()">Abrir real</button></div></div>
<iframe id="prev" class="preview" style="margin-top:12px"></iframe>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>Editar precios - impacta en el código real</b><button class="btn btn-w" onclick="guardar()">💾 Guardar cambios en GitHub</button></div>
<div id="prods" style="margin-top:12px"></div>
<div id="out" class="small"></div>
</div>
</div>
</div>

<script>
let TOKEN=localStorage.getItem('cp_token')||''; let REPO=localStorage.getItem('cp_repo')||'Cartaspro/cartas';
document.getElementById('token').value=TOKEN;
let DATA=[]; let CURRENT=''; let FILES=[];

function saveTok(){ TOKEN=document.getElementById('token').value.trim(); localStorage.setItem('cp_token',TOKEN); listar(); }

async function gh(p,m='GET',b=null){
 const url=`https://api.github.com/repos/${REPO}/contents/${p}`;
 return fetch(url,{method:m,headers:{Authorization:'token '+TOKEN,Accept:'application/vnd.github.v3+json'},body:b?JSON.stringify(b):null});
}

async function listar(){
 if(!TOKEN){document.getElementById('list').innerText='Falta token'; return;}
 document.getElementById('list').innerText='Cargando...';
 const r=await gh('data'); const j=await r.json();
 if(!Array.isArray(j)){document.getElementById('list').innerText='Error: '+j.message; return;}
 const slugs=j.filter(f=>f.name.endsWith('.json')).map(f=>f.name.replace('.json',''));
 document.getElementById('list').innerHTML=slugs.map(s=>`<div class="client ${CURRENT===s?'active':''}" onclick="selectCli('${s}')"><span>${s}</span><span>→</span></div>`).join('')||'Vacío';
}

async function selectCli(s){
 CURRENT=s; document.getElementById('title').innerText=s+' - cartaspro.github.io/cartas/'+s+'/';
 document.getElementById('prev').src=`../${s}/?v=${Date.now()}`;
 // cargar data para editar
 const r=await gh(`data/${s}.json`); if(!r.ok){ document.getElementById('prods').innerText='No existe data/'+s+'.json'; return; }
 const j=await r.json(); DATA=JSON.parse(decodeURIComponent(escape(atob(j.content))));
 renderProds(); listar();
}

function renderProds(){
 document.getElementById('prods').innerHTML=DATA.map(p=>`
  <div class="prod">
   <img src="${p.img||''}" onerror="this.style.display='none'">
   <div style="flex:1">
    <div style="font-size:13px;font-weight:700">${p.nombre}</div>
    <div style="display:flex;gap:6px;margin-top:6px"><input type="number" value="${p.precio}" oninput="DATA.find(x=>x.id==${p.id}).precio=Number(this.value)" style="flex:1"><input value="${p.nombre}" oninput="DATA.find(x=>x.id==${p.id}).nombre=this.value" style="flex:2"></div>
   </div>
   <button class="btn btn-g" onclick="DATA=DATA.filter(x=>x.id!=${p.id});renderProds()">X</button>
  </div>
 `).join('');
}

async function guardar(){
 if(!CURRENT) return alert('Elegí cliente');
 document.getElementById('out').innerText='Guardando en GitHub...';
 const r1=await gh(`data/${CURRENT}.json`); const j1=await r1.json();
 const res=await gh(`data/${CURRENT}.json`,'PUT',{message:`edit precios ${CURRENT} desde admin directo`,sha:j1.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(DATA,null,2))))});
 const jr=await res.json();
 document.getElementById('out').innerText=res.ok?'✓ Guardado! Commit '+jr.commit.sha.slice(0,7)+'. En 60s se ve en la carta real.':'Error: '+jr.message;
 if(res.ok) reload();
}

function reload(){ if(CURRENT) document.getElementById('prev').src=`../${CURRENT}/?v=${Date.now()}`; }
function openReal(){ if(CURRENT) window.open(`../${CURRENT}/`,'_blank'); }

// subir 3 archivos
const drop=document.getElementById('drop'); const fileIn=document.getElementById('fileIn');
drop.addEventListener('click',()=>fileIn.click());
drop.addEventListener('dragover',e=>{e.preventDefault(); drop.style.borderColor='#fff'});
drop.addEventListener('dragleave',()=>drop.style.borderColor='#333');
drop.addEventListener('drop',e=>{e.preventDefault(); FILES=[...e.dataTransfer.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');});
fileIn.addEventListener('change',()=>{ FILES=[...fileIn.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');});

async function subir(){
 const slug=document.getElementById('slugNew').value.trim().toLowerCase().replace(/\s+/g,'-');
 if(!slug) return alert('Slug'); if(!FILES.length) return alert('Archivos');
 document.getElementById('upOut').innerText='Subiendo...\n';
 for(let file of FILES){
  const text=await file.text();
  let path=''; const n=file.name.toLowerCase();
  if(n.endsWith('.html')) path=`${slug}/index.html`;
  else if(n.includes('config')) path=`config/${slug}.json`;
  else path=`data/${slug}.json`;
  // autodetect por contenido si es json
  if(n.endsWith('.json')){ try{ const j=JSON.parse(text); if(Array.isArray(j)) path=`data/${slug}.json`; else path=`config/${slug}.json`; }catch{} }
  const ex=await gh(path); let sha=null; if(ex.ok){ const ej=await ex.json(); sha=ej.sha; }
  const res=await gh(path,'PUT',{message:`upload ${path}`,content:btoa(unescape(encodeURIComponent(text))),...(sha?{sha}:{})});
  document.getElementById('upOut').innerText+=res.ok?`✓ ${path}\n`:`✕ ${path} ${(await res.json()).message}\n`;
 }
 listar();
}

listar();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
