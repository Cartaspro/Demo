<!DOCTYPE html>
<html lang="es">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CartasPro - App Directa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#E11D48;--bg:#0f0f0f;--card:#1c1c1c}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:#fff;padding:16px;max-width:500px;margin:0 auto;padding-bottom:100px}
.card{background:var(--card);border:1px solid #222;border-radius:18px;padding:14px;margin-bottom:12px}
.input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#0f0f0f;color:#fff;margin-top:6px}
.btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:800;margin-top:10px;cursor:pointer}
.primary{background:var(--primary);color:#fff} .green{background:#25D366;color:#fff} .dark{background:#262626;color:#fff;border:1px solid #333}
.prod{background:#0f0f0f;border:1px solid #333;border-radius:14px;padding:10px;margin-bottom:10px;position:relative}
.label{font-size:10px;color:#888;font-weight:700;margin-top:10px;display:block;text-transform:uppercase}
.small{font-size:11px;color:#888}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<h1 style="font-size:22px">CartasPro App</h1>
<p class="small" style="margin:6px 0 14px">Sin tokens. Sin 404. 100% directa.</p>

<div class="card">
<label class="label">Cliente (ej: templar)</label>
<input id="cliente" class="input" value="templar">
<div class="grid2">
<button class="btn dark" onclick="cargar()">Cargar existente</button>
<button class="btn dark" onclick="nuevo()">Nuevo cliente</button>
</div>
<div id="status" class="small" style="margin-top:8px"></div>
</div>

<div class="card">
<label class="label">Nombre del local</label><input id="c_nombre" class="input" value="Templar">
<label class="label">WhatsApp (sin +)</label><input id="c_wa" class="input" value="5491134890644">
<label class="label">Color</label><input id="c_color" class="input" type="color" value="#E11D48">
<label class="label">Envío</label>
<select id="c_tipo" class="input"><option value="fijo">Fijo</option><option value="variable" selected>Variable cada X km</option><option value="gratis">Gratis</option></select>
<div class="grid2"><div><label class="label">Base</label><input id="c_base" class="input" type="number" value="1500"></div><div><label class="label">Cada km</label><input id="c_cada" class="input" type="number" value="2"></div></div>
<label class="label">Precio por tramo</label><input id="c_tramo" class="input" type="number" value="500">
</div>

<div class="card">
<h3 style="font-size:14px">Productos</h3>
<div id="lista" style="margin-top:10px"></div>
<button class="btn dark" onclick="agregarVacio()" style="margin-top:10px">+ Producto</button>
</div>

<div class="card">
<button class="btn green" onclick="guardar()">GENERAR ARCHIVOS Y DESCARGAR</button>
<p class="small" style="margin-top:8px">Te baja 2 archivos .json + instrucciones para subir a GitHub en 10 seg arrastrando. No necesitas token.</p>
<div id="down" style="margin-top:10px"></div>
</div>

<script>
let productos=[];
function render(){
 const cont=document.getElementById('lista');
 let h='';
 productos.forEach((p,i)=>{
  h+=`<div class="prod">
  <div style="display:flex;justify-content:space-between"><b style="font-size:13px">${p.nombre||'Nuevo'}</b><button onclick="borrar(${i})" style="background:#ef4444;border:none;color:#fff;border-radius:50%;width:22px;height:22px">X</button></div>
  <input class="input" placeholder="Nombre" value="${p.nombre}" oninput="productos[${i}].nombre=this.value">
  <div class="grid2"><input class="input" placeholder="Cat" value="${p.categoria}" oninput="productos[${i}].categoria=this.value"><input class="input" type="number" placeholder="Precio" value="${p.precio}" oninput="productos[${i}].precio=parseInt(this.value)||0"></div>
  <input class="input" placeholder="Descripción" value="${p.descripcion}" oninput="productos[${i}].descripcion=this.value">
  <input class="input" placeholder="URL imagen" value="${p.img}" oninput="productos[${i}].img=this.value">
  </div>`;
 });
 cont.innerHTML=h||'<p class=small>Sin productos</p>';
}
function agregarVacio(){ productos.push({id:Date.now(), categoria:'hamburguesas', nombre:'', descripcion:'', precio:0, img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600'}); render(); }
function borrar(i){ productos.splice(i,1); render(); }
function nuevo(){ 
  productos=[
    {id:1,categoria:'hamburguesas',nombre:'Templar Clásica',descripcion:'Doble carne, cheddar, bacon',precio:4500,img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600'},
    {id:2,categoria:'hamburguesas',nombre:'Templar Doble',descripcion:'Triple carne',precio:6200,img:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=600'}
  ];
  document.getElementById('status').innerText='Plantilla Templar cargada. Editá y guardá.';
  render();
}
async function cargar(){
 const name=document.getElementById('cliente').value.trim().toLowerCase();
 if(!name) return;
 document.getElementById('status').innerText='Buscando '+name+'...';
 try{
  const r=await fetch('https://cartaspro.github.io/data/'+name+'.json?v='+Date.now());
  if(!r.ok) throw new Error('No existe aun');
  const data=await r.json();
  productos=data.map(p=>({id:p.id,categoria:p.categoria||p.cat,nombre:p.nombre,descripcion:p.descripcion||p.desc,precio:p.precio,img:p.img}));
  const rc=await fetch('https://cartaspro.github.io/config/'+name+'.json?v='+Date.now()).then(x=>x.json()).catch(()=>null);
  if(rc){ document.getElementById('c_nombre').value=rc.nombre||name; document.getElementById('c_wa').value=rc.whatsapp||''; document.getElementById('c_color').value=rc.color||'#E11D48'; }
  document.getElementById('status').innerText='Cargado '+name+' ('+productos.length+' productos)';
  render();
 }catch(e){ document.getElementById('status').innerText='No existe aun, usa Nuevo cliente'; nuevo(); }
}
function descargar(nombre, contenido){
 const blob=new Blob([contenido],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a'); a.href=url; a.download=nombre; a.click();
}
function guardar(){
 const name=document.getElementById('cliente').value.trim().toLowerCase().replace(/\s+/g,'-');
 if(!name) return alert('Pone nombre cliente');
 const outData=productos.map(p=>({id:p.id||Date.now(),categoria:p.categoria.toLowerCase(),nombre:p.nombre,descripcion:p.descripcion,precio:p.precio,img:p.img}));
 const envioTipo=document.getElementById('c_tipo').value;
 let envio={tipo:envioTipo};
 if(envioTipo==='fijo') envio.costo=1500;
 if(envioTipo==='variable'){ envio.base=parseInt(document.getElementById('c_base').value)||1500; envio.cadaKm=parseInt(document.getElementById('c_cada').value)||2; envio.precioPorTramo=parseInt(document.getElementById('c_tramo').value)||500; }
 const cfg={nombre:document.getElementById('c_nombre').value, whatsapp:document.getElementById('c_wa').value, color:document.getElementById('c_color').value, envio:envio};
 descargar(name+'.json', JSON.stringify(outData,null,2));
 setTimeout(()=>{ descargar(name+'-config.json', JSON.stringify(cfg,null,2)); }, 500);
 document.getElementById('down').innerHTML=`
  <div style="background:#0f0f0f;border:1px solid #25D366;border-radius:12px;padding:12px">
  <b style="color:#25D366">Archivos generados!</b><br>
  <p class=small style="margin-top:6px">1. Bajaste <b>${name}.json</b> y <b>${name}-config.json</b><br>
  2. Anda a <a href="https://github.com/cartaspro/cartaspro.github.io/upload/main" target="_blank" style="color:#25D366">Subir archivos a GitHub</a><br>
  3. Arrastra los 2 archivos<br>
  4. En la segunda subida, sube <b>${name}.json</b> a la carpeta <b>data/</b> (renombralo a <b>data/${name}.json</b> antes) y <b>${name}-config.json</b> a <b>config/${name}.json</b><br><br>
  O mas facil: crea los archivos manual como te dije: data/${name}.json y config/${name}.json y pega el contenido.<br><br>
  <a href="https://cartaspro.github.io/${name}/" target="_blank" style="color:#25D366">Ver carta de ${name} en 1 min</a></p>
  </div>
 `;
}
nuevo();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
