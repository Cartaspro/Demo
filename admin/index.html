<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin FINAL - Activo / Baja</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f0f0f;color:#fff}
.top{padding:14px 18px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f0f0f;z-index:20}
.main{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;min-height:100vh}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.left{border-right:1px solid #1c1c1c;padding:14px}
.right{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:18px;padding:16px}
input,textarea{background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;width:100%;font-size:14px}
.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer;font-size:12px}
.btn-w{background:#fff;color:#000} .btn-r{background:#E11D48;color:#fff} .btn-g{background:#262626;color:#fff} .btn-del{background:#ff0033;color:#fff}
.client{padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;background:#0f0f0f;border:1px solid #1c1c1c;font-size:13px}
.client.active{border-color:#fff;background:#fff;color:#000}
.client .status{font-size:10px;padding:4px 8px;border-radius:100px;font-weight:800}
.status-ok{background:#00ff88;color:#000} .status-baja{background:#ff0033;color:#fff}
.preview{width:100%;height:480px;border-radius:16px;border:1px solid #262626;background:#000}
.kv{margin-bottom:14px}
.kv label{display:block;font-size:11px;color:#E11D48;font-weight:800;letter-spacing:.6px;margin-bottom:6px;text-transform:uppercase}
.group{border:1px solid #2a2a2a;border-radius:14px;padding:12px;margin-bottom:12px;background:#151515}
.switch-wrap{display:flex;align-items:center;justify-content:space-between;background:#101010;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:14px}
.switch{width:56px;height:32px;background:#333;border-radius:100px;position:relative;cursor:pointer;transition:.2s}
.switch.on{background:#00ff88}
.switch .knob{width:26px;height:26px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s}
.switch.on .knob{left:27px}
.badge{font-size:10px;background:#0f0f0f;border:1px solid #262626;padding:5px 9px;border-radius:100px;color:#888}
.prod-card{background:#101010;border:1px solid #262626;border-radius:16px;padding:12px;display:grid;grid-template-columns:80px 1fr;gap:12px;margin-bottom:12px}
.prod-card img{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#1c1c1c}
.field{display:flex;flex-direction:column;margin-bottom:8px}
.field label{font-size:10px;color:#888;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:11px;color:#777;margin-top:6px;line-height:1.4}
</style>
</head><body>
<div class="top">
<div style="font-weight:900;display:flex;gap:10px;align-items:center"><div style="width:28px;height:28px;background:#E11D48;border-radius:8px;display:flex;align-items:center;justify-content:center">C</div> Admin FINAL - Activo / Baja</div>
<div style="display:flex;gap:8px"><input id="token" type="password" placeholder="ghp_..." style="width:200px"><button class="btn btn-w" onclick="saveTok()">Guardar token</button></div>
</div>

<div class="main">
<div class="left">
<div class="card"><b>Clientes - Estado de pago</b><div class="small" style="margin:6px 0">Verde = ACTIVA (abonó) / Rojo = BAJA (no abonó)</div><div id="list" style="margin-top:10px">Cargando...</div></div>
<div class="card"><b style="font-size:12px">Subir 3 archivos</b><input id="slugNew" placeholder="slug: el-fuego" style="margin-top:8px"><div id="drop" style="margin-top:8px;border:1px dashed #444;border-radius:12px;padding:14px;text-align:center;font-size:12px;color:#888;cursor:pointer">Arrastrá acá<input id="fileIn" type="file" multiple hidden></div><button class="btn btn-w" style="width:100%;margin-top:8px" onclick="subir()">Subir</button><div id="upOut" class="small"></div></div>
</div>

<div class="right">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="title">Elegí cliente</b><div><button class="btn btn-g" onclick="reload()">↻</button> <button class="btn btn-g" onclick="openReal()">Abrir real</button></div></div>
<iframe id="prev" class="preview" style="margin-top:10px"></iframe>
<div id="estadoZone"></div>
<div id="delZone"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>CONFIG + ENVIO + ESTADO</b><button class="btn btn-w" onclick="guardarConfig()">💾 Guardar config</button></div>
<div id="configEditor" style="margin-top:14px"></div>
<div id="outC" class="small"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>DATA.JSON</b><button class="btn btn-w" onclick="guardarData()">💾 Guardar productos</button></div>
<div id="prods" style="margin-top:14px"></div>
<div id="out" class="small"></div>
</div>
</div>
</div>

<script>
let TOKEN=localStorage.getItem('cp_token')||''; let REPO=localStorage.getItem('cp_repo')||'Cartaspro/cartas';
document.getElementById('token').value=TOKEN;
let DATA=[]; let CONFIG={}; let CURRENT=''; let FILES=[];
function saveTok(){ TOKEN=document.getElementById('token').value.trim(); localStorage.setItem('cp_token',TOKEN); listar(); }
async function gh(p,m='GET',b=null){ return fetch(`https://api.github.com/repos/${REPO}/contents/${p}`,{method:m,headers:{Authorization:'token '+TOKEN,Accept:'application/vnd.github.v3+json'},body:b?JSON.stringify(b):null}); }

async function listar(){
 if(!TOKEN){document.getElementById('list').innerText='Poné token';return;}
 const r=await gh('data'); const j=await r.json(); if(!Array.isArray(j)){document.getElementById('list').innerText=j.message;return;}
 const slugs=j.filter(f=>f.name.endsWith('.json')).map(f=>f.name.replace('.json',''));
 let html='';
 for(const s of slugs){
   let st='...'; let cls=''; try{ const rc=await gh(`config/${s}.json`); if(rc.ok){ const jj=await rc.json(); const cfg=JSON.parse(decodeURIComponent(escape(atob(jj.content)))); const act = cfg.activo!==false && cfg.estado!=='baja'; st=act?'ACTIVA':'BAJA'; cls=act?'status-ok':'status-baja'; } }catch(e){}
   html+=`<div class="client ${CURRENT===s?'active':''}"><span style="flex:1;cursor:pointer" onclick="selectCli('${s}')">${s} <span class="status ${cls}">${st}</span></span><button class="btn btn-g" style="padding:6px 10px;font-size:10px" onclick="borrarCliente('${s}')">🗑️</button></div>`;
 }
 document.getElementById('list').innerHTML=html||'Sin clientes';
}

async function selectCli(s){
 CURRENT=s; document.getElementById('title').innerText=s+' — cartaspro.github.io/cartas/'+s+'/'; document.getElementById('prev').src=`../${s}/?v=${Date.now()}`;
 const rd=await gh(`data/${s}.json`); if(rd.ok){ const j=await rd.json(); DATA=JSON.parse(decodeURIComponent(escape(atob(j.content)))); renderData(); }
 const rc=await gh(`config/${s}.json`); if(rc.ok){ const j=await rc.json(); CONFIG=JSON.parse(decodeURIComponent(escape(atob(j.content)))); renderConfig(); renderEstado(); }
 document.getElementById('delZone').innerHTML=`<div style="border:1px solid #333;border-radius:12px;padding:10px;margin-top:10px"><span class="small">Borrar ${s} definitivo</span> <button class="btn btn-del" onclick="borrarCliente('${s}')">Borrar</button> <span id="delOut" class="small"></span></div>`;
 listar();
}

function renderEstado(){
 const activo = CONFIG.activo!==false && CONFIG.estado!=='baja';
 document.getElementById('estadoZone').innerHTML=`
  <div class="switch-wrap" style="margin-top:12px;border-color:${activo?'#00ff88':'#ff0033'}">
   <div><b style="font-size:14px">${activo?'✅ ACTIVA - Cliente al día':'⛔ BAJA - Sin pago'}</b><div class="small">${activo?'La página funciona normal':'La página muestra: Pagina inactiva, contacta soporte'}</div></div>
   <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:11px;font-weight:800">${activo?'ACTIVA':'BAJA'}</span>
    <div class="switch ${activo?'on':''}" onclick="toggleActivo()"><div class="knob"></div></div>
   </div>
  </div>`;
}

function toggleActivo(){
 const actualmenteActivo = CONFIG.activo!==false && CONFIG.estado!=='baja';
 CONFIG.activo = !actualmenteActivo;
 CONFIG.estado = CONFIG.activo ? 'activo' : 'baja';
 renderEstado(); renderConfig();
 guardarConfig();
}

function renderConfig(){
 const c=document.getElementById('configEditor'); c.innerHTML='';
 for(const [k,v] of Object.entries(CONFIG)){
   if(k==='activo' || k==='estado') continue; // ya está en el switch
   if(v!==null && typeof v==='object' && !Array.isArray(v)){
     let html=`<div class="group"><b>${k.toUpperCase()}</b>`;
     for(const [sk,sv] of Object.entries(v)){ html+=`<div class="kv"><label>${k}.${sk}</label><input value="${String(sv).replace(/"/g,'&quot;')}" oninput="CONFIG['${k}']['${sk}']=coerce(this.value)"></div>`; }
     html+=`</div>`; c.innerHTML+=html;
   } else {
     c.innerHTML+=`<div class="kv"><label>${k}</label><input value="${String(v).replace(/"/g,'&quot;')}" oninput="CONFIG['${k}']=coerce(this.value)"></div>`;
   }
 }
}
function coerce(val){ if(val==='true') return true; if(val==='false') return false; if(val!=='' && !isNaN(val)){ const n=Number(val); if(String(n)===val) return n; } return val; }

function renderData(){
 const container=document.getElementById('prods'); container.innerHTML='';
 DATA.forEach((p,i)=>{
   container.innerHTML+=`<div class="prod-card"><img src="${p.img||''}" onerror="this.style.display='none'"><div><div class="field"><label>NOMBRE</label><input value="${p.nombre||''}" oninput="DATA[${i}].nombre=this.value"></div><div class="row2"><div class="field"><label>PRECIO</label><input type="number" value="${p.precio||0}" oninput="DATA[${i}].precio=Number(this.value)"></div><div class="field"><label>CATEGORIA</label><input value="${p.categoria||''}" oninput="DATA[${i}].categoria=this.value"></div></div><div class="field"><label>DESCRIPCION</label><textarea oninput="DATA[${i}].descripcion=this.value">${p.descripcion||''}</textarea></div><div class="field"><label>IMG</label><input value="${p.img||''}" oninput="DATA[${i}].img=this.value"></div></div></div>`;
 });
}

async function guardarConfig(){ if(!CURRENT) return; const r1=await gh(`config/${CURRENT}.json`); const j1=await r1.json(); const res=await gh(`config/${CURRENT}.json`,'PUT',{message:`estado ${CONFIG.estado} ${CURRENT}`,sha:j1.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(CONFIG,null,2))))}); document.getElementById('outC').innerText=res.ok?'✓ Guardado':'Error'; reload(); listar(); }
async function guardarData(){ if(!CURRENT) return; const r1=await gh(`data/${CURRENT}.json`); const j1=await r1.json(); const res=await gh(`data/${CURRENT}.json`,'PUT',{message:`edit ${CURRENT}`,sha:j1.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(DATA,null,2))))}); document.getElementById('out').innerText=res.ok?'✓ Guardado':'Error'; reload(); }
async function borrarCliente(slug){ if(!confirm(`Borrar ${slug}?`)) return; for(const p of [`data/${slug}.json`,`config/${slug}.json`,`${slug}/index.html`]){ const r=await gh(p); if(r.ok){ const j=await r.json(); await gh(p,'DELETE',{message:`delete ${p}`,sha:j.sha}); } } CURRENT=''; listar(); }
function reload(){ if(CURRENT) document.getElementById('prev').src=`../${CURRENT}/?v=${Date.now()}`; }
function openReal(){ if(CURRENT) window.open(`../${CURRENT}/`,'_blank'); }
const drop=document.getElementById('drop'); const fileIn=document.getElementById('fileIn');
drop.addEventListener('click',()=>fileIn.click()); drop.addEventListener('dragover',e=>e.preventDefault()); drop.addEventListener('drop',e=>{e.preventDefault(); FILES=[...e.dataTransfer.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');}); fileIn.addEventListener('change',()=>{ FILES=[...fileIn.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');});
async function subir(){ const slug=document.getElementById('slugNew').value.trim().toLowerCase().replace(/\s+/g,'-'); if(!slug||!FILES.length) return alert('Falta'); for(let file of FILES){ const text=await file.text(); let path=''; if(file.name.toLowerCase().endsWith('.html')) path=`${slug}/index.html`; else { try{ const j=JSON.parse(text); if(Array.isArray(j)) path=`data/${slug}.json`; else path=`config/${slug}.json`; }catch{ path=`config/${slug}.json`; } } const ex=await gh(path); let sha=null; if(ex.ok){ const ej=await ex.json(); sha=ej.sha; } await gh(path,'PUT',{message:`upload ${path}`,content:btoa(unescape(encodeURIComponent(text))),...(sha?{sha}:{})}); } document.getElementById('upOut').innerText+='\n✓ Subido'; listar(); }
listar();
</script>
</body></html>
