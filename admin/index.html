<!DOCTYPE html>
<html lang="es">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CartasPro Admin - /cartas/</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f0f0f;color:#fff;padding:16px}
.box{max-width:900px;margin:0 auto;background:#1c1c1c;border:1px solid #222;border-radius:16px;padding:16px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;margin-top:6px}
button{padding:12px 18px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.primary{background:#E11D48;color:#fff}
.secondary{background:#262626;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.prod{border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-top:10px;background:#111}
.badge{display:inline-block;background:#222;padding:4px 8px;border-radius:20px;font-size:11px}
.ok{color:#25D366} .err{color:#ef4444}
.small{font-size:11px;color:#888}
</style>
</head>
<body>
<div class="box">
<h2>CartasPro Admin</h2>
<p class="small">Repo fijo: <b>Cartaspro/cartas</b> | Base: <b>/cartas/</b> | Detectado: <span id="det"></span></p>

<div style="margin-top:14px;padding:12px;background:#111;border-radius:12px;border:1px dashed #333">
<label class="small">Token GitHub (con permiso repo) - se guarda solo en tu navegador</label>
<input id="token" type="password" placeholder="ghp_...">
<div class="row" style="margin-top:8px">
<button class="secondary" onclick="guardarToken()">Guardar Token</button>
<button class="secondary" onclick="borrarToken()">Borrar</button>
</div>
<p id="tokenStatus" class="small"></p>
</div>

<div style="margin-top:14px">
<label>Cliente (nombre carpeta)</label>
<div class="row">
<input id="cliente" placeholder="ej: templar, demo, la-casona">
<button class="primary" onclick="cargar()">Cargar</button>
</div>
<p id="status" class="small"></p>
</div>

<div id="configBox" style="margin-top:16px;display:none">
<h3>Config</h3>
<div class="row">
<div><label>Nombre</label><input id="cfgNombre"></div>
<div><label>WhatsApp (549...)</label><input id="cfgWa"></div>
</div>
<div class="row">
<div><label>Color</label><input id="cfgColor" type="color" value="#E11D48"></div>
<div><label>Envío</label><select id="cfgEnvioTipo"><option value="fijo">Fijo</option><option value="gratis">Gratis</option><option value="variable">Variable por km</option></select></div>
</div>
<div class="row">
<div><label>Costo / Base</label><input id="cfgCosto" type="number" value="1500"></div>
<div><label>Cada Km / Precio Tramo</label><input id="cfgTramo" type="number" value="500"></div>
</div>
</div>

<div id="productosBox" style="margin-top:16px;display:none">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>Productos</h3><button class="secondary" onclick="addProd()">+ Producto</button></div>
<div id="lista"></div>
</div>

<div style="margin-top:18px;display:flex;gap:8px">
<button class="primary" onclick="guardarTodo()">Guardar en GitHub</button>
<button class="secondary" onclick="descargar()">Descargar JSONs (sin token)</button>
</div>
<p id="saveStatus" class="small" style="margin-top:8px"></p>
</div>

<script>
const REPO = 'Cartaspro/cartas';
const BASE = '/cartas/';
document.getElementById('det').innerText = location.pathname;
let productos = [];
let clienteActual = '';

function guardarToken(){ localStorage.setItem('gh_token_cartas', document.getElementById('token').value.trim()); updTokenStatus(); }
function borrarToken(){ localStorage.removeItem('gh_token_cartas'); document.getElementById('token').value=''; updTokenStatus(); }
function getToken(){ return localStorage.getItem('gh_token_cartas')||''; }
function updTokenStatus(){
  const t=getToken();
  document.getElementById('tokenStatus').innerHTML = t ? `<span class="ok">Token guardado (${t.slice(0,4)}...${t.slice(-4)}) listo para commitear a ${REPO}</span>` : `<span class="err">Sin token - solo podrás descargar archivos</span>`;
  document.getElementById('token').value = t;
}
updTokenStatus();

async function cargar(){
  clienteActual = document.getElementById('cliente').value.trim().toLowerCase().replace(/\s+/g,'-');
  if(!clienteActual) return alert('Poné nombre cliente');
  document.getElementById('status').innerText = 'Cargando '+clienteActual+' desde '+BASE+'...';
  try{
    const dataUrl = BASE + 'data/'+clienteActual+'.json';
    const cfgUrl = BASE + 'config/'+clienteActual+'.json';
    // intenta relativo también
    let dataRes = await fetch('../data/'+clienteActual+'.json?v='+Date.now());
    if(!dataRes.ok) dataRes = await fetch(dataUrl+'?v='+Date.now());
    let cfgRes = await fetch('../config/'+clienteActual+'.json?v='+Date.now());
    if(!cfgRes.ok) cfgRes = await fetch(cfgUrl+'?v='+Date.now());
    
    if(dataRes.ok){ productos = await dataRes.json(); } else { productos = []; }
    if(cfgRes.ok){
      const cfg = await cfgRes.json();
      document.getElementById('cfgNombre').value = cfg.nombre||clienteActual;
      document.getElementById('cfgWa').value = cfg.whatsapp||'';
      document.getElementById('cfgColor').value = cfg.color||'#E11D48';
      if(cfg.envio){
        document.getElementById('cfgEnvioTipo').value = cfg.envio.tipo||'fijo';
        document.getElementById('cfgCosto').value = cfg.envio.costo||cfg.envio.base||1500;
        document.getElementById('cfgTramo').value = cfg.envio.precioPorTramo||500;
      }
    } else {
      document.getElementById('cfgNombre').value = clienteActual;
    }
    document.getElementById('configBox').style.display='block';
    document.getElementById('productosBox').style.display='block';
    render();
    document.getElementById('status').innerHTML = `<span class="ok">Cargado ${clienteActual} (${productos.length} prods) desde ${REPO}</span>`;
  }catch(e){
    document.getElementById('status').innerHTML = `<span class="err">Error: ${e.message} - Si no existe, creá nuevo</span>`;
    document.getElementById('configBox').style.display='block';
    document.getElementById('productosBox').style.display='block';
    productos = [];
    render();
  }
}

function render(){
  const c=document.getElementById('lista');
  c.innerHTML = productos.map((p,i)=>`
  <div class="prod">
    <div class="row">
      <div><label>Nombre</label><input value="${p.nombre||''}" oninput="productos[${i}].nombre=this.value"></div>
      <div><label>Precio</label><input type="number" value="${p.precio||0}" oninput="productos[${i}].precio=parseInt(this.value)||0"></div>
    </div>
    <label>Descripción</label><input value="${(p.descripcion||p.desc||'').replace(/"/g,'&quot;')}" oninput="productos[${i}].descripcion=this.value">
    <div class="row">
      <div><label>Categoría</label><input value="${p.categoria||p.cat||''}" oninput="productos[${i}].categoria=this.value.toLowerCase()"></div>
      <div><label>Imagen URL</label><input value="${p.img||''}" oninput="productos[${i}].img=this.value"></div>
    </div>
    <button class="secondary" style="margin-top:8px" onclick="productos.splice(${i},1);render()">Eliminar</button>
  </div>
  `).join('') || '<p class="small">Sin productos</p>';
}
function addProd(){ productos.push({id:Date.now(), categoria:'general', nombre:'Nuevo producto', descripcion:'', precio:1000, img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600'}); render(); }

function getConfigObj(){
  const tipo = document.getElementById('cfgEnvioTipo').value;
  const costo = parseInt(document.getElementById('cfgCosto').value)||0;
  const tramo = parseInt(document.getElementById('cfgTramo').value)||500;
  let envio={tipo};
  if(tipo==='fijo') envio={tipo:'fijo', costo};
  if(tipo==='gratis') envio={tipo:'gratis', costo:0};
  if(tipo==='variable') envio={tipo:'variable', base:costo, cadaKm:2, precioPorTramo:tramo};
  return {
    nombre: document.getElementById('cfgNombre').value||clienteActual,
    whatsapp: document.getElementById('cfgWa').value||'5491134890644',
    color: document.getElementById('cfgColor').value||'#E11D48',
    envio
  };
}

async function guardarTodo(){
  if(!clienteActual) return alert('Cargá un cliente primero');
  const token=getToken();
  if(!token) return alert('Poné el token primero arriba, o usa Descargar JSONs');
  const cfg = getConfigObj();
  document.getElementById('saveStatus').innerText = 'Guardando en GitHub...';
  try{
    await commitFile(`data/${clienteActual}.json`, JSON.stringify(productos,null,2));
    await commitFile(`config/${clienteActual}.json`, JSON.stringify(cfg,null,2));
    // si no existe carpeta cliente, intenta crear index base copiando de demo si existe
    document.getElementById('saveStatus').innerHTML = `<span class="ok">Guardado OK en ${REPO}. Esperá 2 min y recargá https://cartaspro.github.io/cartas/${clienteActual}/</span>`;
  }catch(e){
    document.getElementById('saveStatus').innerHTML = `<span class="err">Error: ${e.message}</span>`;
  }
}

async function commitFile(path, content){
  const token=getToken();
  const apiUrl = `https://api.github.com/repos/${REPO}/contents/${path}`;
  // get sha if exists
  let sha=null;
  try{
    const r=await fetch(apiUrl, {headers:{Authorization:`token ${token}`}});
    if(r.ok){ const j=await r.json(); sha=j.sha; }
  }catch(e){}
  const body={
    message:`Update ${path} via admin /cartas/`,
    content: btoa(unescape(encodeURIComponent(content))),
    ...(sha?{sha}:{})
  };
  const res=await fetch(apiUrl,{method:'PUT', headers:{Authorization:`token ${token}`, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text(); throw new Error(t); }
}

function descargar(){
  const cfg=getConfigObj();
  const a=document.createElement('a');
  a.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(productos,null,2));
  a.download=`${clienteActual}.json`;
  a.click();
  const b=document.createElement('a');
  b.href='data:text/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(cfg,null,2));
  b.download=`${clienteActual}-config.json`;
  b.click();
}
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
