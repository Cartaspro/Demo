<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin DEFINITIVO CORREGIDO - Switch + Botón Guardar Real</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0f0f0f;color:#fff}
.top{padding:14px 18px;border-bottom:1px solid #1c1c1c;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f0f0f;z-index:20}
.main{max-width:1450px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;min-height:100vh}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.left{border-right:1px solid #1c1c1c;padding:14px} .right{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#1c1c1c;border:1px solid #262626;border-radius:18px;padding:16px}
input,textarea,select{background:#0f0f0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;width:100%;font-size:14px}
.btn{padding:10px 16px;border-radius:100px;border:0;font-weight:800;cursor:pointer;font-size:12px}
.btn-w{background:#fff;color:#000} .btn-r{background:#E11D48;color:#fff} .btn-g{background:#262626;color:#fff} .btn-y{background:#FFD60A;color:#000} .btn-del{background:#ff0033;color:#fff}
.client{padding:11px 12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;background:#0f0f0f;border:1px solid #1c1c1c;font-size:13px}
.client.active{border-color:#fff;background:#fff;color:#000}
.status{font-size:10px;padding:4px 8px;border-radius:100px;font-weight:800} .ok{background:#00ff88;color:#000} .baja{background:#ff0033;color:#fff}
.preview{width:100%;height:480px;border-radius:16px;border:1px solid #262626;background:#000}
.kv{margin-bottom:14px} .kv label{display:block;font-size:11px;color:#E11D48;font-weight:800;margin-bottom:6px;text-transform:uppercase}
.group{border:1px solid #2a2a2a;border-radius:14px;padding:12px;margin-bottom:12px;background:#151515}
.switch-wrap{display:flex;align-items:center;justify-content:space-between;background:#101010;border:2px solid #333;border-radius:14px;padding:16px;margin-bottom:12px}
.switch{width:60px;height:34px;background:#333;border-radius:100px;position:relative;cursor:pointer;transition:.2s} .switch.on{background:#00ff88} .knob{width:28px;height:28px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:.2s} .switch.on .knob{left:29px}
.prod-card{background:#101010;border:1px solid #262626;border-radius:16px;padding:14px;display:grid;grid-template-columns:90px 1fr;gap:14px;margin-bottom:14px}
.prod-card img{width:90px;height:90px;border-radius:12px;object-fit:cover;background:#1c1c1c}
.field{display:flex;flex-direction:column;margin-bottom:8px} .field label{font-size:10px;color:#888;font-weight:700;margin-bottom:4px;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:11px;color:#777;margin-top:6px;line-height:1.4}
.uploadBox{border:1px dashed #444;border-radius:10px;padding:8px;text-align:center;cursor:pointer;background:#0f0f0f}
</style>
</head><body>
<div class="top">
<div style="font-weight:900;display:flex;gap:10px;align-items:center"><div style="width:28px;height:28px;background:#E11D48;border-radius:8px;display:flex;align-items:center;justify-content:center">C</div> Admin CORREGIDO - Switch con Guardar</div>
<div style="display:flex;gap:8px"><input id="token" type="password" placeholder="ghp_..." style="width:220px"><button class="btn btn-w" onclick="saveTok()">Guardar token</button></div>
</div>

<div class="main">
<div class="left">
<div class="card"><b>Clientes - ACTIVA / BAJA</b><div class="small">El switch ahora tiene botón GUARDAR que sí impacta en GitHub</div><div id="list" style="margin-top:10px">Cargando...</div></div>
<div class="card"><b style="font-size:12px">Subir 3 archivos cliente nuevo</b><input id="slugNew" placeholder="slug: queseria" style="margin-top:8px"><div id="drop" style="margin-top:8px;border:1px dashed #444;border-radius:12px;padding:14px;text-align:center;font-size:12px;color:#888;cursor:pointer">Arrastrá acá<input id="fileIn" type="file" multiple hidden></div><button class="btn btn-w" style="width:100%;margin-top:8px" onclick="subir()">Subir</button><div id="upOut" class="small"></div></div>
</div>

<div class="right">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="title">Elegí cliente</b><div><button class="btn btn-g" onclick="reload()">↻ Vista</button> <button class="btn btn-g" onclick="openReal()">Abrir real</button></div></div>
<iframe id="prev" class="preview" style="margin-top:10px"></iframe>
<div id="estadoZone"></div>
<div id="delZone"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>CONFIG - Dirección, Maps, Envío</b><button class="btn btn-w" onclick="guardarConfig()">💾 Guardar config</button></div>
<div id="configEditor" style="margin-top:14px"></div>
<div style="margin-top:10px"><button class="btn btn-g" onclick="addConfigField()">+ Agregar campo</button></div>
<div id="outC" class="small"></div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center"><b>PRODUCTOS - Con foto WhatsApp</b><button class="btn btn-w" onclick="guardarData()">💾 Guardar productos</button></div>
<div id="prods" style="margin-top:14px"></div>
<div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-g" onclick="addProd()">+ Producto</button></div>
<div id="out" class="small"></div>
</div>
</div>
</div>

<script>
let TOKEN=localStorage.getItem('cp_token')||''; let REPO=localStorage.getItem('cp_repo')||'Cartaspro/cartas';
document.getElementById('token').value=TOKEN;
let DATA=[]; let CONFIG={}; let CURRENT=''; let FILES=[];

function saveTok(){ TOKEN=document.getElementById('token').value.trim(); localStorage.setItem('cp_token',TOKEN); listar(); }
async function gh(p,m='GET',b=null){ return fetch(`https://api.github.com/repos/${REPO}/contents/${p}`,{method:m,headers:{Authorization:'token '+TOKEN,Accept:'application/vnd.github.v3+json'},body:b?JSON.stringify(b):null}); }

async function listar(){
 if(!TOKEN){document.getElementById('list').innerText='Poné token';return;}
 const r=await gh('data'); const j=await r.json(); if(!Array.isArray(j)){document.getElementById('list').innerText=j.message;return;}
 const slugs=j.filter(f=>f.name.endsWith('.json')).map(f=>f.name.replace('.json',''));
 let html='';
 for(const s of slugs){
   let st='...'; let cls='';
   try{ const rc=await gh(`config/${s}.json`); if(rc.ok){ const jj=await rc.json(); const cfg=JSON.parse(decodeURIComponent(escape(atob(jj.content)))); const act = cfg.activo!==false && cfg.estado!=='baja'; st=act?'ACTIVA':'BAJA'; cls=act?'ok':'baja'; } }catch(e){}
   html+=`<div class="client ${CURRENT===s?'active':''}"><span style="flex:1;cursor:pointer" onclick="selectCli('${s}')">${s} <span class="status ${cls}">${st}</span></span><button class="btn btn-g" style="padding:6px 10px;font-size:10px" onclick="borrarCliente('${s}')">🗑️</button></div>`;
 }
 document.getElementById('list').innerHTML=html||'Sin clientes';
}

async function selectCli(s){
 CURRENT=s; document.getElementById('title').innerText=s+' — cartaspro.github.io/cartas/'+s+'/'; document.getElementById('prev').src=`../${s}/?v=${Date.now()}`;
 const rd=await gh(`data/${s}.json`); if(rd.ok){ const j=await rd.json(); DATA=JSON.parse(decodeURIComponent(escape(atob(j.content)))); renderData(); }
 const rc=await gh(`config/${s}.json`); if(rc.ok){ const j=await rc.json(); CONFIG=JSON.parse(decodeURIComponent(escape(atob(j.content)))); renderConfig(); renderEstado(); }
 document.getElementById('delZone').innerHTML=`<div style="border:1px solid #333;border-radius:12px;padding:10px;margin-top:10px"><span class="small">Borrar ${s}</span> <button class="btn btn-del" onclick="borrarCliente('${s}')">Borrar todo</button> <span id="delOut" class="small"></span></div>`;
 listar();
}

function renderEstado(){
 const activo = CONFIG.activo!==false && CONFIG.estado!=='baja';
 document.getElementById('estadoZone').innerHTML=`
  <div class="switch-wrap" style="border-color:${activo?'#00ff88':'#ff0033'};border-width:2px">
   <div><b style="font-size:15px">${activo?'✅ ACTIVA - Cliente al día':'⛔ BAJA - Página frenada'}</b><div class="small">${activo?'La página anda normal':'Muestra: Pagina inactiva, si sos el dueño del local contacta con soporte - SIN tu número'}</div></div>
   <div style="display:flex;align-items:center;gap:12px">
     <span style="font-size:11px;font-weight:800">${activo?'ACTIVA':'BAJA'}</span>
     <div class="switch ${activo?'on':''}" onclick="toggleActivoLocal()"><div class="knob"></div></div>
     <button class="btn ${activo?'btn-del':'btn-y'}" onclick="guardarEstado()">${activo?'Pasar a BAJA y Guardar':'Pasar a ACTIVA y Guardar'}</button>
   </div>
  </div>
  <div id="estadoOut" class="small" style="margin-top:8px;color:#FFD60A"></div>`;
}

// Solo cambia local, no guarda
function toggleActivoLocal(){
 const act = CONFIG.activo!==false && CONFIG.estado!=='baja';
 CONFIG.activo=!act; CONFIG.estado=CONFIG.activo?'activo':'baja';
 renderEstado(); renderConfig();
 document.getElementById('estadoOut').innerText='⚠️ Cambio local, ahora dale a GUARDAR para que impacte en la página real';
}

// Guarda en GitHub de verdad
async function guardarEstado(){
 if(!CURRENT) return;
 document.getElementById('estadoOut').innerText='Guardando en GitHub...';
 try{
   const r1=await gh(`config/${CURRENT}.json`);
   if(!r1.ok){ document.getElementById('estadoOut').innerText='Error leyendo config: '+r1.status; return; }
   const j1=await r1.json();
   const res=await gh(`config/${CURRENT}.json`,'PUT',{
     message:`${CONFIG.estado} ${CURRENT} - switch con boton guardar`,
     sha:j1.sha,
     content:btoa(unescape(encodeURIComponent(JSON.stringify(CONFIG,null,2))))
   });
   const jr=await res.json();
   if(res.ok){
     document.getElementById('estadoOut').innerText=`✅ ${CONFIG.estado.toUpperCase()} guardado en GitHub! Recargá la carta en 20 seg. Si es BAJA verás "Pagina inactiva..." sin tu número`;
     reload(); listar();
   } else {
     document.getElementById('estadoOut').innerText='❌ Error GitHub: '+(jr.message||res.status);
   }
 }catch(e){ document.getElementById('estadoOut').innerText='❌ Error: '+e; }
}

function renderConfig(){
 const c=document.getElementById('configEditor'); c.innerHTML='';
 for(const [k,v] of Object.entries(CONFIG)){
   if(k==='activo' || k==='estado') continue;
   if(v!==null && typeof v==='object' && !Array.isArray(v)){
     let html=`<div class="group"><b>${k.toUpperCase()}</b>`;
     for(const [sk,sv] of Object.entries(v)){ html+=`<div class="kv"><label>${k}.${sk}</label><input value="${String(sv).replace(/"/g,'&quot;')}" oninput="setNested('${k}','${sk}',this.value)"></div>`; }
     html+=`</div>`; c.innerHTML+=html;
   } else {
     c.innerHTML+=`<div class="kv"><label>${k}</label><input value="${String(v).replace(/"/g,'&quot;')}" oninput="setFlat('${k}',this.value)"></div>`;
   }
 }
}
function setFlat(k,val){ CONFIG[k]=coerce(val); }
function setNested(pk,sk,val){ CONFIG[pk][sk]=coerce(val); }
function coerce(val){ if(val==='true') return true; if(val==='false') return false; if(val!=='' && !isNaN(val) && String(Number(val))===val) return Number(val); return val; }
function addConfigField(){ const k=prompt('Campo: ej direccion, telefono, googleMaps.embed, envio.costoFijo'); if(!k) return; if(k.includes('.')){ const [p,s]=k.split('.'); CONFIG[p]=CONFIG[p]||{}; CONFIG[p][s]=''; } else CONFIG[k]=''; renderConfig(); }

function renderData(){
 const container=document.getElementById('prods'); container.innerHTML='';
 DATA.forEach((p,i)=>{
   container.innerHTML+=`
   <div class="prod-card">
    <div><img id="img_${i}" src="${p.img||''}" onerror="this.style.opacity=.2"><div class="uploadBox" style="margin-top:8px" onclick="document.getElementById('file_${i}').click()">📷 Subir foto</div><input id="file_${i}" type="file" accept="image/*" hidden onchange="subirFoto(this,${i})"><div id="up_${i}" class="small"></div></div>
    <div>
     <div class="field"><label>Nombre</label><input value="${esc(p.nombre||'')}" oninput="DATA[${i}].nombre=this.value"></div>
     <div class="row2"><div class="field"><label>Precio</label><input type="number" value="${p.precio||0}" oninput="DATA[${i}].precio=Number(this.value)"></div><div class="field"><label>Categoria</label><input value="${esc(p.categoria||'')}" oninput="DATA[${i}].categoria=this.value"></div></div>
     <div class="field"><label>Descripcion</label><textarea oninput="DATA[${i}].descripcion=this.value">${esc(p.descripcion||'')}</textarea></div>
     <div class="field"><label>IMG URL</label><input id="url_${i}" value="${esc(p.img||'')}" oninput="DATA[${i}].img=this.value;document.getElementById('img_${i}').src=this.value"></div>
     <div style="display:flex;justify-content:space-between;margin-top:8px"><span class="badge">ID ${p.id}</span><button class="btn btn-g" onclick="DATA.splice(${i},1);renderData()">Borrar</button></div>
    </div>
   </div>`;
 });
}
function esc(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function addProd(){ const nid=DATA.length?Math.max(...DATA.map(p=>p.id||0))+1:1; DATA.push({id:nid,nombre:'Nuevo',precio:0,categoria:'',descripcion:'',img:''}); renderData(); }

async function subirFoto(input, idx){
 const file=input.files[0]; if(!file) return;
 const out=document.getElementById('up_'+idx); out.innerText='Subiendo...';
 const reader=new FileReader();
 reader.onload=async function(){
   const base64=reader.result.split(',')[1];
   const ext=file.name.split('.').pop()||'jpg';
   const path=`img/${CURRENT}/${CURRENT}-${DATA[idx].id}-${Date.now()}.${ext}`;
   try{
     const ex=await gh(path); let sha=null; if(ex.ok){ const ej=await ex.json(); sha=ej.sha; }
     const res=await gh(path,'PUT',{message:`foto ${DATA[idx].nombre}`,content:base64,sha:sha||undefined});
     if(res.ok){
       const url=`https://raw.githubusercontent.com/${REPO}/main/${path}`;
       DATA[idx].img=url; document.getElementById('img_'+idx).src=url; document.getElementById('url_'+idx).value=url; out.innerText='✓ Foto subida';
     } else { out.innerText='Error '+(await res.json()).message; }
   }catch(e){ out.innerText='Error '+e; }
 };
 reader.readAsDataURL(file);
}

async function guardarConfig(){ if(!CURRENT) return; const r1=await gh(`config/${CURRENT}.json`); const j1=await r1.json(); const res=await gh(`config/${CURRENT}.json`,'PUT',{message:`config ${CONFIG.estado} ${CURRENT}`,sha:j1.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(CONFIG,null,2))))}); document.getElementById('outC').innerText=res.ok?'✓ Config guardada':'Error'; reload(); listar(); }
async function guardarData(){ if(!CURRENT) return; const r1=await gh(`data/${CURRENT}.json`); const j1=await r1.json(); const res=await gh(`data/${CURRENT}.json`,'PUT',{message:`data ${CURRENT}`,sha:j1.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(DATA,null,2))))}); document.getElementById('out').innerText=res.ok?'✓ Productos guardados':'Error'; reload(); }
async function borrarCliente(slug){ if(!confirm(`Borrar ${slug}?`)) return; for(const p of [`data/${slug}.json`,`config/${slug}.json`,`${slug}/index.html`]){ const r=await gh(p); if(r.ok){ const j=await r.json(); await gh(p,'DELETE',{message:`delete ${p}`,sha:j.sha}); } } CURRENT=''; listar(); }
function reload(){ if(CURRENT) document.getElementById('prev').src=`../${CURRENT}/?v=${Date.now()}`; }
function openReal(){ if(CURRENT) window.open(`../${CURRENT}/`,'_blank'); }
const drop=document.getElementById('drop'); const fileIn=document.getElementById('fileIn');
drop.addEventListener('click',()=>fileIn.click()); drop.addEventListener('dragover',e=>e.preventDefault()); drop.addEventListener('drop',e=>{e.preventDefault(); FILES=[...e.dataTransfer.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');}); fileIn.addEventListener('change',()=>{ FILES=[...fileIn.files]; document.getElementById('upOut').innerText=FILES.map(f=>f.name).join('\n');});
async function subir(){ const slug=document.getElementById('slugNew').value.trim().toLowerCase().replace(/\s+/g,'-'); if(!slug||!FILES.length) return alert('Falta slug o archivos'); for(let file of FILES){ const text=await file.text(); let path=''; if(file.name.toLowerCase().endsWith('.html')) path=`${slug}/index.html`; else { try{ const j=JSON.parse(text); if(Array.isArray(j)) path=`data/${slug}.json`; else path=`config/${slug}.json`; }catch{ path=`config/${slug}.json`; } } const ex=await gh(path); let sha=null; if(ex.ok){ const ej=await ex.json(); sha=ej.sha; } await gh(path,'PUT',{message:`upload ${path}`,content:btoa(unescape(encodeURIComponent(text))),...(sha?{sha}:{})}); } document.getElementById('upOut').innerText+='\n✓ Subido'; listar(); }
listar();
</script>
</body></html>
