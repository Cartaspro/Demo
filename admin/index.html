<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CartasPro - Admin Maestro V2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#E11D48;--bg:#0f0f0f;--card:#1c1c1c;--border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:#fff;padding:14px;max-width:900px;margin:0 auto;padding-bottom:120px}
h1{font-size:20px} .sub{color:#9ca3af;font-size:12px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.label{font-size:10px;color:#9ca3af;font-weight:700;text-transform:uppercase;margin-top:10px;display:block}
.input{width:100%;padding:11px;border-radius:10px;border:1px solid #333;background:#0f0f0f;color:#fff;margin-top:5px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:800;cursor:pointer;margin-top:8px}
.primary{background:var(--primary);color:#fff} .secondary{background:#262626;color:#fff;border:1px solid #333} .green{background:#25D366;color:#fff} .ghost{background:transparent;border:1px dashed #333;color:#9ca3af}
.prod{background:#0f0f0f;border:1px solid #333;border-radius:12px;padding:10px;position:relative;margin-bottom:10px}
.prod img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:#111}
.del{position:absolute;top:8px;right:8px;background:#ef4444;border:none;color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:800}
.client{display:flex;align-items:center;justify-content:space-between;padding:11px;border-radius:12px;background:#0f0f0f;border:1px solid #333;margin-bottom:7px;cursor:pointer}
.client.active{border-color:var(--primary);background:#1f1114}
.tag{font-size:10px;background:#262626;padding:3px 8px;border-radius:10px}
.status{font-size:11px;margin-top:6px}
</style>
</head>
<body>
<h1>CartasPro Admin Maestro</h1>
<p class="sub">Un solo panel para todos los clientes. Versión arreglada.</p>

<div class="card" id="setupCard">
<h3 style="font-size:13px">🔑 GitHub (solo 1 vez)</h3>
<label class="label">Owner</label><input id="gh_owner" class="input" value="cartaspro">
<label class="label">Repo</label><input id="gh_repo" class="input" value="cartaspro.github.io">
<label class="label">Branch</label><input id="gh_branch" class="input" value="main">
<label class="label">Token ghp_...</label><input id="gh_token" class="input" type="password" placeholder="pega tu token aqui">
<div class="grid2">
<button class="btn secondary" onclick="guardarSetup()">Guardar</button>
<button class="btn ghost" onclick="window.open('https://github.com/settings/tokens/new','_blank')">Crear token</button>
</div>
<div id="setupStatus" class="status"></div>
<p style="font-size:10px;color:#666;margin-top:6px">Token classic > marca solo repo > Generate. Se guarda solo en tu celu.</p>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3 style="font-size:13px">Clientes</h3>
<button onclick="cargarClientes()" style="background:#262626;border:1px solid #333;color:#fff;padding:5px 10px;border-radius:8px;font-size:11px">Recargar</button>
</div>
<div id="clientList" style="margin-top:10px"></div>
<div style="margin-top:10px;display:flex;gap:8px">
<input id="newClientName" class="input" placeholder="ej: templar" style="margin-top:0">
<button class="btn secondary" style="width:auto;margin-top:0;padding:11px 14px" onclick="crearNuevoCliente()">+ Nuevo</button>
</div>
<div id="saveStatus" class="status"></div>
</div>

<div id="editor" style="display:none">
<div class="card">
<h3 style="font-size:13px">Editando: <span id="editingName" style="color:#E11D48"></span> <a id="editingLink" target="_blank" style="font-size:11px;color:#25D366;margin-left:6px"></a></h3>
<label class="label">Nombre</label><input id="c_nombre" class="input">
<label class="label">WhatsApp</label><input id="c_wa" class="input">
<label class="label">Color</label><input id="c_color" class="input" type="color">
<label class="label">Tipo envio</label>
<select id="c_tipo" class="input" onchange="toggleEnvio()"><option value="fijo">Fijo</option><option value="variable">Variable cada X km</option><option value="gratis">Gratis</option></select>
<div id="env-fijo"><label class="label">Costo fijo</label><input id="c_costo" class="input" type="number"></div>
<div id="env-variable" style="display:none"><div class="grid2"><div><label class="label">Base</label><input id="c_base" class="input" type="number"></div><div><label class="label">Cada km</label><input id="c_cada" class="input" type="number"></div></div><label class="label">Precio por tramo</label><input id="c_tramo" class="input" type="number"></div>
</div>
<div class="card">
<h3 style="font-size:13px">Productos</h3>
<div id="lista"></div>
<div style="margin-top:10px;border-top:1px solid #222;padding-top:10px">
<label class="label">+ Agregar</label>
<input id="n_nombre" class="input" placeholder="Nombre">
<div class="grid2"><input id="n_cat" class="input" placeholder="categoria"><input id="n_precio" class="input" type="number" placeholder="precio"></div>
<input id="n_desc" class="input" placeholder="descripcion">
<input id="n_img" class="input" placeholder="url imagen">
<button class="btn primary" onclick="agregar()">Agregar producto</button>
</div>
</div>
<div class="card">
<button class="btn green" id="btnGuardar" onclick="guardarTodo()">GUARDAR EN GITHUB</button>
<div id="saveStatus2" class="status"></div>
<p style="font-size:10px;color:#666;margin-top:6px">Si falla el guardado automatico, avísame y te paso los 2 JSON para pegar manual.</p>
</div>
</div>

<script>
let GH={owner:'cartaspro',repo:'cartaspro.github.io',branch:'main',token:''};
let clientes=[]; let current=null; let productos=[]; 
function loadSetup(){
 try{ const s=JSON.parse(localStorage.getItem('cartaspro_gh')||'{}'); GH.owner=s.owner||GH.owner; GH.repo=s.repo||GH.repo; GH.branch=s.branch||GH.branch; GH.token=s.token||''; document.getElementById('gh_owner').value=GH.owner; document.getElementById('gh_repo').value=GH.repo; document.getElementById('gh_branch').value=GH.branch; document.getElementById('gh_token').value=GH.token; if(GH.token) document.getElementById('setupStatus').innerText='Token cargado'; }catch(e){}
}
loadSetup();
function guardarSetup(){ GH.owner=document.getElementById('gh_owner').value.trim()||'cartaspro'; GH.repo=document.getElementById('gh_repo').value.trim()||'cartaspro.github.io'; GH.branch=document.getElementById('gh_branch').value.trim()||'main'; GH.token=document.getElementById('gh_token').value.trim(); localStorage.setItem('cartaspro_gh',JSON.stringify(GH)); document.getElementById('setupStatus').innerText='Guardado. Ahora recarga clientes.'; cargarClientes(); }
async function ghApi(path, method, body){
 if(!GH.token) throw new Error('Falta token');
 const url='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path+'?ref='+GH.branch;
 const headers={Authorization:'token '+GH.token, Accept:'application/vnd.github.v3+json'};
 const opts={method:method||'GET', headers:headers};
 if(body) opts.body=JSON.stringify(body);
 const res=await fetch(url, opts);
 if(!res.ok){ const t=await res.text(); throw new Error(res.status+' '+t.substring(0,300)); }
 return res.json();
}
function toBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fromBase64(b64){ try{ return decodeURIComponent(escape(atob(b64))); }catch(e){ return atob(b64); } }
async function cargarClientes(){
 const listDiv=document.getElementById('clientList');
 if(!GH.token){ listDiv.innerHTML='<p style="color:#f59e0b;font-size:11px">Pone token arriba primero.</p>'; return; }
 listDiv.innerHTML='Cargando...';
 try{
  const dataFiles=await ghApi('data').catch(function(){return [];});
  let names=[];
  if(Array.isArray(dataFiles)){ names=dataFiles.filter(function(f){return f.name.endsWith('.json');}).map(function(f){return f.name.replace('.json','');}); }
  const root=await ghApi('').catch(function(){return [];});
  let folders=[];
  if(Array.isArray(root)){ folders=root.filter(function(f){return f.type==='dir' && ['data','config','admin','images','.github'].indexOf(f.name)===-1;}).map(function(f){return f.name;}); }
  let merged={}; names.concat(folders).forEach(function(n){merged[n]=1;});
  clientes=Object.keys(merged);
  renderClientes();
 }catch(e){ listDiv.innerHTML='<p style="color:#ef4444;font-size:11px">Error: '+e.message+'</p>'; }
}
function renderClientes(){
 const cont=document.getElementById('clientList');
 if(clientes.length===0){ cont.innerHTML='<p style="color:#666;font-size:11px">Sin clientes. Crea uno abajo.</p>'; return; }
 let html='';
 clientes.forEach(function(name){
  const active=current===name?' active':'';
  html+='<div class="client'+active+'" onclick="abrirCliente(\''+name+'\')"><div><b>'+name+'</b> <span class="tag">'+name+'</span><br><span style="font-size:10px;color:#9ca3af">cartaspro.github.io/'+name+'/</span></div><div>-></div></div>';
 });
 cont.innerHTML=html;
}
async function abrirCliente(name){
 current=name;
 document.getElementById('editingName').innerText=name;
 document.getElementById('editingLink').innerText='ver carta';
 document.getElementById('editingLink').href='https://'+GH.owner+'.github.io/'+name+'/';
 document.getElementById('editor').style.display='block';
 renderClientes();
 productos=[];
 try{
  const dataContent=await ghApi('data/'+name+'.json');
  const txt=fromBase64(dataContent.content.replace(/\n/g,''));
  const json=JSON.parse(txt);
  productos=json.map(function(p){ return {id:p.id, cat:(p.categoria||p.cat||'otros').toLowerCase(), nombre:p.nombre, desc:p.descripcion||p.desc||'', precio:p.precio, img:p.img}; });
 }catch(e){ productos=[]; }
 try{
  const cfgContent=await ghApi('config/'+name+'.json');
  const txt=fromBase64(cfgContent.content.replace(/\n/g,''));
  const json=JSON.parse(txt);
  document.getElementById('c_nombre').value=json.nombre||name;
  document.getElementById('c_wa').value=json.whatsapp||'';
  document.getElementById('c_color').value=json.color||'#E11D48';
  document.getElementById('c_tipo').value=(json.envio&&json.envio.tipo)||'fijo';
  document.getElementById('c_costo').value=(json.envio&&json.envio.costo)||1500;
  document.getElementById('c_base').value=(json.envio&&json.envio.base)||1500;
  document.getElementById('c_cada').value=(json.envio&&json.envio.cadaKm)||2;
  document.getElementById('c_tramo').value=(json.envio&&json.envio.precioPorTramo)||500;
  toggleEnvio();
 }catch(e){
  document.getElementById('c_nombre').value=name;
  document.getElementById('c_wa').value='5491134890644';
  document.getElementById('c_color').value='#E11D48';
  document.getElementById('c_tipo').value='fijo';
  document.getElementById('c_costo').value=1500;
  toggleEnvio();
 }
 renderProductos();
}
function toggleEnvio(){ const t=document.getElementById('c_tipo').value; document.getElementById('env-fijo').style.display=t==='fijo'?'block':'none'; document.getElementById('env-variable').style.display=t==='variable'?'block':'none'; }
function renderProductos(){
 const cont=document.getElementById('lista');
 let html='';
 productos.forEach(function(p){
  html+='<div class="prod"><button class="del" onclick="borrar('+p.id+')">X</button><img src="'+p.img+'" onerror="this.src=\'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400\'" /><input class="input" value="'+p.nombre.replace(/"/g,'&quot;')+'" onchange="edit('+p.id+',\'nombre\',this.value)" /><div class="grid2"><input class="input" value="'+p.cat+'" onchange="edit('+p.id+',\'cat\',this.value)" /><input class="input" type="number" value="'+p.precio+'" onchange="edit('+p.id+',\'precio\',this.value)" /></div><input class="input" value="'+(p.desc||'').replace(/"/g,'&quot;')+'" onchange="edit('+p.id+',\'desc\',this.value)" /><input class="input" value="'+p.img+'" onchange="edit('+p.id+',\'img\',this.value)" style="font-size:10px" /></div>';
 });
 if(html==='') html='<p style="color:#666;font-size:11px">Sin productos</p>';
 cont.innerHTML=html;
}
function edit(id,campo,val){ const p=productos.find(function(x){return x.id===id}); if(!p) return; if(campo==='precio') p[campo]=parseInt(val)||0; else p[campo]=val; }
function borrar(id){ productos=productos.filter(function(p){return p.id!==id;}); renderProductos(); }
function agregar(){ const nombre=document.getElementById('n_nombre').value.trim(); if(!nombre) return alert('Nombre'); productos.push({id:Date.now(), cat:(document.getElementById('n_cat').value||'otros').toLowerCase(), nombre:nombre, desc:document.getElementById('n_desc').value, precio:parseInt(document.getElementById('n_precio').value)||0, img:document.getElementById('n_img').value||'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600'}); ['n_nombre','n_cat','n_precio','n_desc','n_img'].forEach(function(i){document.getElementById(i).value='';}); renderProductos(); }
async function getSha(path){ try{ const f=await ghApi(path); return f.sha; }catch(e){ return null; } }
async function crearNuevoCliente(){
 const input=document.getElementById('newClientName'); let name=input.value.trim().toLowerCase().replace(/\s+/g,'-'); if(!name) return alert('Pone nombre ej templar'); if(!GH.token) return alert('Falta token');
 document.getElementById('saveStatus').innerText='Creando '+name+'...';
 try{
  const emptyData=JSON.stringify([{id:1,categoria:'otros',nombre:'Producto ejemplo',descripcion:'Descripcion',precio:1000,img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600'}],null,2);
  await ghApi('data/'+name+'.json','PUT',{message:'feat: nuevo cliente '+name+' data', content:toBase64(emptyData), branch:GH.branch});
  const emptyConfig=JSON.stringify({nombre:name, whatsapp:'5491134890644', color:'#E11D48', envio:{tipo:'fijo',costo:1500}},null,2);
  await ghApi('config/'+name+'.json','PUT',{message:'feat: nuevo cliente '+name+' config', content:toBase64(emptyConfig), branch:GH.branch});
  const simpleIndex='<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+name+'</title></head><body><h1 style="font-family:sans-serif;text-align:center;margin-top:50px">Cliente '+name+' creado. Copia el index de Demo aqui.</h1><p style="text-align:center"><a href="../Demo/">Ver Demo</a></p></body></html>';
  const shaIndex=await getSha(name+'/index.html');
  let body={message:'feat: cliente '+name+' index', content:toBase64(simpleIndex), branch:GH.branch};
  if(shaIndex) body.sha=shaIndex;
  await ghApi(name+'/index.html','PUT',body);
  document.getElementById('saveStatus').innerText='Cliente '+name+' creado. Ahora avisame y lo llenamos.';
  input.value=''; cargarClientes();
 }catch(e){ document.getElementById('saveStatus').innerText='Error: '+e.message; }
}
async function guardarTodo(){
 if(!current) return alert('Elegi cliente');
 const btn=document.getElementById('btnGuardar'); btn.innerText='Guardando...'; btn.disabled=true;
 try{
  const outData=productos.map(function(p){ return {id:p.id,categoria:p.cat,nombre:p.nombre,descripcion:p.desc,precio:p.precio,img:p.img}; });
  const tipo=document.getElementById('c_tipo').value;
  let envio={tipo:tipo};
  if(tipo==='fijo') envio.costo=parseInt(document.getElementById('c_costo').value)||0;
  if(tipo==='variable'){ envio.base=parseInt(document.getElementById('c_base').value)||0; envio.cadaKm=parseInt(document.getElementById('c_cada').value)||2; envio.precioPorTramo=parseInt(document.getElementById('c_tramo').value)||0; }
  const cfg={nombre:document.getElementById('c_nombre').value, whatsapp:document.getElementById('c_wa').value, color:document.getElementById('c_color').value, envio:envio};
  const dataStr=JSON.stringify(outData,null,2);
  const configStr=JSON.stringify(cfg,null,2);
  const shaData=await getSha('data/'+current+'.json');
  let bodyData={message:'update: '+current+' productos', content:toBase64(dataStr), branch:GH.branch}; if(shaData) bodyData.sha=shaData;
  await ghApi('data/'+current+'.json','PUT',bodyData);
  const shaCfg=await getSha('config/'+current+'.json');
  let bodyCfg={message:'update: '+current+' config', content:toBase64(configStr), branch:GH.branch}; if(shaCfg) bodyCfg.sha=shaCfg;
  await ghApi('config/'+current+'.json','PUT',bodyCfg);
  document.getElementById('saveStatus2').innerHTML='Guardado! <a href="https://'+GH.owner+'.github.io/'+current+'/?v='+Date.now()+'" target="_blank" style="color:#25D366">Ver carta</a>';
  document.getElementById('saveStatus').innerText='Guardado OK';
 }catch(e){ document.getElementById('saveStatus2').innerText='Error: '+e.message; } finally{ btn.innerText='GUARDAR EN GITHUB'; btn.disabled=false; }
}
</script>
</body>
</html>
